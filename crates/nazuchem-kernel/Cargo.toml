[package]
name = "nazuchem-kernel"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Internal molecular perception kernel for nazuchem, adapted from RDKit and centres"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
thiserror = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"

[dev-dependencies]
anyhow = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }
