[package]
name = "reshiki-python"
version.workspace = true
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Headless ReShiki structures, figures and analysis for Python"

[lib]
name = "_native"
crate-type = ["cdylib"]
# The extension resolves Python symbols when imported; exercise it with pytest.
test = false
doctest = false

[dependencies]
reshiki-io = { path = "../io" }
reshiki-model = { path = "../model" }
opsin = { path = "../opsin" }
pyo3 = { version = "0.29", features = ["abi3-py310", "extension-module"] }
rayon = "1.12"
resvg = "0.45"
svg2pdf = { version = "0.13", default-features = false, features = ["text", "image"] }
png = "0.17"
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
