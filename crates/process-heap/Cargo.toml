[package]
name = "reshiki-process-heap"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Bounded allocator for isolated ReShiki worker processes"

[features]
allocation-metrics = []
# JavaScript clocks are available in the browser, not in plain Wasm hosts.
browser = ["dep:web-time"]

# std's clock is unavailable on wasm32-unknown-unknown.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = { version = "1", optional = true }
