[package]
name = "reshiki-process-heap"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Bounded allocator for isolated ReShiki worker processes"

[features]
allocation-metrics = []

# std's clock is unavailable in the browser.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"
