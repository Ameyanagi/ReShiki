[package]
name = "reshiki-model"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Documents, scenes, styles and editing for ReShiki"

[features]
default = []
# Optional Python/RDKit development oracles, never part of release builds.
rdkit-reference = ["reshiki-chemistry/rdkit-reference"]

[dependencies]
nazuchem-ir = { workspace = true }
reshiki-chemistry = { path = "../chemistry" }
reshiki-metafile = { path = "../metafile" }
iced_core = "0.14"
# Already used by the renderer; cycle perimeters share its cubic arc-length solver.
kurbo = "0.11.3"
# Large embedded data is stored deflated (build.rs) and inflated on first use.
miniz_oxide = "0.8"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "tiff",
  "webp",
  "gif",
  "bmp",
] }
png = "0.17"
resvg = "0.45"
roxmltree = "0.20"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = { version = "0.10.9", default-features = false, features = ["force-soft"] }
svgtypes = "0.15"
tempfile = "3"
thiserror = "2"
tiff = "0.11.3"
ttf-parser = "0.25"
i_overlay = "9.1.0"

[build-dependencies]
miniz_oxide = "0.8"

[dev-dependencies]
nazuchem-kernel = { workspace = true }
anyhow = "1"
nazuchem-n2s = { workspace = true }
reshiki-process-heap = { path = "../process-heap", features = ["allocation-metrics"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
