[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "reshiki-xtb"
dynamic = ["version"]
description = "The axtb calculation engine for reshiki.xtb"
readme = "README.md"
requires-python = ">=3.10"
license = "LGPL-3.0-or-later"
# Generated by scripts/license_notices.py before building a wheel.
license-files = [
  "wheel-licenses/LICENSE",
  "wheel-licenses/LICENSE-MIT",
  "wheel-licenses/LICENSE-APACHE",
  "wheel-licenses/NOTICE",
  "wheel-licenses/THIRD-PARTY-NOTICES.txt",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Typing :: Typed",
  "Topic :: Scientific/Engineering :: Chemistry",
]

[project.urls]
Homepage = "https://github.com/Ameyanagi/ReShiki"
Issues = "https://github.com/Ameyanagi/ReShiki/issues"
Source = "https://github.com/Ameyanagi/ReShiki/releases"

[dependency-groups]
dev = ["ruff>=0.15", "ty>=0.0.24"]

[tool.maturin]
manifest-path = "../xtb-worker/Cargo.toml"
bindings = "bin"
features = ["engine"]
python-source = "python"
module-name = "reshiki_xtb"
strip = true
include = ["python/reshiki_xtb/py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["python/reshiki_xtb"]
