[package]
name = "opsin"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A native Rust port of OPSIN chemical name interpretation"
publish = false

[dependencies]
nazuchem-kernel = { path = "../nazuchem-kernel" }
roxmltree = "0.20"
regex = "1"

[dev-dependencies]
serde_json = "1"
sha2 = { version = "0.10.9", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
