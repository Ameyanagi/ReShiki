[package]
name = "reshiki-web"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Headless ReShiki import, export and rendering for the browser"

[lib]
crate-type = ["cdylib"]

[dependencies]
reshiki-io = { path = "../io" }
reshiki-model = { path = "../model" }
serde_json = { version = "1", features = ["float_roundtrip"] }
# The `code` property of the errors the exports throw.
js-sys = "0.3"
# scripts/build_wasm.sh installs the wasm-bindgen CLI of exactly this version.
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4"
