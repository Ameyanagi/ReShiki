[package]
name = "reshiki-xtb-jobs"
version.workspace = true
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[features]
test-fixtures = ["dep:serde_json"]

[dependencies]
reshiki-io = { path = "../io" }
reshiki-qcdata = { path = "../qcdata" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reshiki-model = { path = "../model" }
reshiki-optimize = { path = "../optimize" }
reshiki-xtb-worker = { path = "../xtb-worker" }
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = ["macros", "rt", "time"] }

[dev-dependencies]
serde_json = "1"
