[test-groups]
naming-worker = { max-threads = 2 }
native-clipboard = { max-threads = 1 }

[[profile.default.overrides]]
# Nextest processes cannot share naming's in-process semaphores, so this group
# limits the tests that launch the naming worker: app callers in the bin,
# naming/CLI/clipboard callers, and process-limit fixtures. Two run at a time.
# One at a time set the whole test phase (Windows 618 s, macOS 550 s). Two used
# 293 MiB at their peak; each worker is limited to 384 MiB (macOS, 2026-11-15).
filter = """
package(reshiki) & (
  (kind(bin) & test(/^app::(atom_labels|clipboard|naming|shortcut_focus_tests::review_close|workspace::(layout_snapshots|view_parity_tests))::/))
  | test(/^(naming|cli|clipboard)::/)
  | binary_id(reshiki::cli)
  | binary_id(reshiki::stated_ez_wedges)
) | package(reshiki-process)
"""
test-group = 'naming-worker'

[[profile.default.overrides]]
# These Windows namespaces share the system clipboard; their Rust mutex is
# process-local. macOS clipboard tests use private, uniquely named pasteboards.
filter = 'package(reshiki-windows) & (test(/^clipboard::/) | test(/^ole::embedded::/))'
test-group = 'native-clipboard'

[profile.ci]
fail-fast = false
status-level = "skip"
# No retries. A test is reported as slow after 60 seconds and stopped as failed
# after 15 minutes, so a hang fails the job in minutes, not at the job timeout.
# The slowest test took 222 seconds with one worker test at a time (cold Windows
# run, 2026-11-13) and 319 seconds with two on a busy Mac.
slow-timeout = { period = "60s", terminate-after = 15 }

[profile.ci.junit]
# target/nextest/ci/junit.xml; checks.yml uploads it from each partition.
path = "junit.xml"
