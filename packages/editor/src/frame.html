<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ReShiki editor</title>
    <style>
      html,
      body,
      #editor {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="editor"></div>
    <script type="module">
      // The page embed.js loads into an iframe. It answers its parent's
      // { id, method, args } messages with { id, result } or { id, error },
      // and posts { event: "ready" | "change" } and { event: "fonterror", error }.
      // embed() passes its fonts as JSON in the `fonts` query parameter.
      import { mount } from "./editor.js";

      const METHODS = new Set(["load", "save", "exportImage"]);
      // The page that embeds this frame. The frame posts to that origin only
      // and answers no other, so the drawing never reaches another page.
      const embedder =
        location.ancestorOrigins?.[0] ??
        (document.referrer ? new URL(document.referrer).origin : location.origin);
      const post = (message) => parent.postMessage(message, embedder);
      // Anyone can link to this page with a `fonts` parameter, so it fetches
      // fonts only from its own origin or the embedding page's.
      const fonts = JSON.parse(new URLSearchParams(location.search).get("fonts") ?? "{}");
      const allowed = (font) =>
        [location.origin, embedder].includes(new URL(font, location.href).origin);
      const refuse = (font) =>
        post({
          event: "fonterror",
          error: `The font ${font} is not on this page's origin, so it was not loaded`,
        });
      const pageFonts = Array.isArray(fonts.fonts) ? fonts.fonts : [];
      pageFonts.filter((font) => !allowed(font)).forEach(refuse);
      let cjkFont = fonts.cjkFont;
      if (typeof cjkFont === "string" && !allowed(cjkFont)) {
        refuse(cjkFont);
        cjkFont = false;
      }
      const ready = mount(document.getElementById("editor"), {
        fonts: pageFonts.filter(allowed),
        cjkFont,
        onChange: () => post({ event: "change" }),
        onError: (error) => post({ event: "fonterror", error: String(error?.message ?? error) }),
      });
      ready.then(
        () => post({ event: "ready" }),
        (error) => post({ event: "error", error: String(error) }),
      );

      addEventListener("message", async ({ source, origin, data }) => {
        if (source !== parent || origin !== embedder || !METHODS.has(data?.method)) return;
        try {
          const editor = await ready;
          const result = await editor[data.method](...(data.args ?? []));
          post({ id: data.id, result });
        } catch (error) {
          post({ id: data.id, error: String(error?.message ?? error) });
        }
      });
    </script>
  </body>
</html>
