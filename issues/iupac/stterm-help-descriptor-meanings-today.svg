<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 262" width="360" height="262"><rect x="0" y="0" width="360" height="262" fill="#ffffff"/><text x="14" y="26" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" font-weight="bold" text-anchor="start"><tspan>ReShiki today (schematic of panel)</tspan></text><line x1="14" y1="36" x2="346" y2="36" stroke="#d9d9d9" stroke-width="1"/><rect x="14" y="48" width="332" height="124" rx="8" fill="#fafafa" stroke="#d0d0d0"/><text x="28" y="74" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#666666" font-weight="bold" text-anchor="start"><tspan>STEREOCHEMISTRY</tspan></text><rect x="28" y="88" width="16" height="16" rx="3" fill="#2f6fde"/><path d="M31.5 96.5 l3.5 3.5 l6 -7" fill="none" stroke="#fff" stroke-width="2"/><text x="52" y="101" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan>Show R/S and E/Z labels</tspan></text><text x="28" y="130" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#555555" font-weight="normal" text-anchor="start"><tspan>Labels update after chemical edits.</tspan></text><text x="28" y="150" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#555555" font-weight="normal" text-anchor="start"><tspan>Unassigned centers have no R/S label.</tspan></text><ellipse cx="140" cy="96" rx="122" ry="18" fill="none" stroke="#d0342c" stroke-width="2"/><text x="14" y="200" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan>The canvas can also show lowercase (</tspan><tspan font-style="italic">r</tspan><tspan>) (</tspan><tspan font-style="italic">s</tspan><tspan>),</tspan></text><text x="14" y="222" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan>but nothing explains them; Help has no entry</tspan></text><text x="14" y="244" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan>for “CIP”, “pseudoasymmetric” or “r/s”.</tspan></text></svg>
