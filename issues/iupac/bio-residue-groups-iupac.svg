<text x="180.0" y="159.7" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#222" font-weight="normal">-Ala- = -NH-CH(CH3)-CO- (3AA-16);</text>
