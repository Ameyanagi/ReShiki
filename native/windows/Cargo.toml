[package]
name = "reshiki-windows"
version = "0.1.0"
edition = "2024"
publish = false
description = "Small, safe Windows clipboard and printing interface for ReShiki"

[target.'cfg(windows)'.dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "bmp",
  "tiff",
  "webp",
] }
png = "0.17"
tempfile = "3"
windows-core = "0.58"
windows = { version = "0.58", features = [
  "implement",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Memory",
  "Win32_System_DataExchange",
  "Win32_System_Threading",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Controls_Dialogs",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_GdiPlus",
  "Win32_Storage_Xps",
] }
