[package]
name = "reshiki-linux"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Bounded Linux clipboard selection transport for ReShiki"

[target.'cfg(target_os = "linux")'.dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustix = { version = "1.1.4", features = ["event", "fs", "pipe"] }
x11rb = "0.13.2"
raw-window-handle = "=0.6.2"
# Must resolve to the same patched instance used by Iced/window_clipboard.
smithay-clipboard = "=0.7.3"
