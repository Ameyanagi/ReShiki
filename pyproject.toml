[project]
name = "moruno-engine"
version = "0.1.0"
description = "Local chemistry worker for Moruno"
requires-python = ">=3.11,<3.14"
dependencies = ["rdkit>=2025.9,<2027", "pillow>=12.3,<13"]

[dependency-groups]
dev = ["ruff>=0.16.8", "ty>=0.0.82"]

[tool.uv]
package = false
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  # Windows ARM runs the same x64 chemistry worker through Windows 11 emulation.
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Worker/test entry points establish their local module search path first.
"engine/worker.py" = ["E402"]
"tests/*.py" = ["E402"]
"scripts/regenerate_templates.py" = ["E402"]

[tool.ty.environment]
python-version = "3.12"
extra-paths = ["scripts"]

[tool.ty.src]
include = ["engine", "scripts"]
