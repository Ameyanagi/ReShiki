pre-commit:
  parallel: false
  commands:
    oxlint:
      glob: "*.{js,mjs,cjs,ts,tsx,jsx,json}"
      run: bun run lint:js
    oxfmt:
      glob: "*.{js,mjs,cjs,ts,tsx,jsx,json,css,md,mdx,yml,yaml,toml}"
      run: bun run --bun oxfmt --check {staged_files}
    ruff:
      glob: "*.{py,toml,lock}"
      run: uv run --locked ruff check engine scripts tests
    ruff-format:
      glob: "*.{py,toml,lock}"
      run: uv run --locked ruff format --check engine scripts tests
    ty:
      glob: "*.{py,toml,lock}"
      run: uv run --locked ty check
    cargo-fmt:
      glob: "*.{rs,toml,lock}"
      run: cargo fmt --all --check
    cargo-clippy:
      glob: "*.{rs,toml,lock}"
      run: cargo clippy --all-targets --all-features --locked -- -D warnings
    cargo-check:
      glob: "*.{rs,toml,lock}"
      run: cargo check --all-targets --all-features --locked
