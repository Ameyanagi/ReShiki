pre-commit:
  parallel: false
  commands:
    oxlint:
      glob: "*.{js,mjs,cjs,ts,tsx,jsx,json}"
      run: bun run lint:js
    oxfmt:
      glob: "*.{js,mjs,cjs,ts,tsx,jsx,json,css,md,mdx,yml,yaml,toml}"
      exclude: "assets/**"
      run: bun run --bun oxfmt --check --no-error-on-unmatched-pattern {staged_files}
    ruff:
      glob: "*.{py,toml,lock}"
      run: uv run --locked ruff check reference scripts tests
    ruff-format:
      glob: "*.{py,toml,lock}"
      run: uv run --locked ruff format --check reference scripts tests
    ty:
      glob: "*.{py,toml,lock}"
      run: uv run --locked ty check
    cargo-fmt:
      glob: "*.{rs,toml,lock}"
      run: cargo fmt --all --check
    # Clippy type-checks libraries and binaries with all features, so a
    # separate `cargo check` would repeat the build. Tests and examples (about
    # 100 targets) are linted by CI on every pull request, not on each commit.
    cargo-clippy:
      glob: "*.{rs,toml,lock}"
      run: cargo clippy --workspace --lib --bins --all-features --locked -- -D warnings
