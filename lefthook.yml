pre-commit:
  parallel: false
  commands:
    oxlint:
      glob: "*.{js,mjs,cjs,ts,tsx,jsx,json}"
      run: bun run lint:js
    bun-fmt:
      glob: "*.{js,mjs,cjs,ts,tsx,jsx,json,css,html,md,mdx,yml,yaml,toml}"
      exclude: "assets/**"
      run: bun fmt --check --no-error-on-unmatched-pattern {staged_files}
    # Python files and the two files that set the Python tools and their versions.
    ruff:
      glob: &python ["*.py", "pyproject.toml", "uv.lock"]
      run: uv run --locked ruff check reference scripts tests
    ruff-format:
      glob: *python
      run: uv run --locked ruff format --check reference scripts tests
    ty:
      glob: *python
      run: uv run --locked ty check
    cargo-fmt:
      glob: "*.{rs,toml,lock}"
      run: cargo fmt --all --check
# Clippy type-checks every library and binary with all features, which is too
# slow for each commit, so it runs once per push. Tests and examples (about 100
# targets) are linted by CI on every pull request.
pre-push:
  commands:
    cargo-clippy:
      glob: "*.{rs,toml,lock}"
      run: cargo clippy --workspace --lib --bins --all-features --locked -- -D warnings
