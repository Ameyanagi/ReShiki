name: Abbreviation geometry capture
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/abbreviation-geometry.yml
      - reference/engine/abbreviations.py
      - src/chemistry/abbreviations/presets.json
      - reference/abbreviation_replacement_reference.py
permissions:
  contents: read
jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            system: macos
            arch: aarch64
            python: "3.12"
          - os: ubuntu-22.04
            system: linux
            arch: x86_64
            python: "3.12"
          - os: ubuntu-24.04-arm
            system: linux
            arch: aarch64
            python: "3.12"
          - os: windows-2022
            system: windows
            arch: x86_64
            python: cpython-3.12-windows-x86_64-none
          - os: windows-11-arm
            system: windows
            arch: aarch64
            python: cpython-3.12-windows-x86_64-none
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.3"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: Capture geometry on the matching host
        run: uv run --locked python reference/abbreviation_replacement_reference.py --write-geometry --target-arch ${{ matrix.arch }}
      - name: Record capture provenance
        shell: bash
        run: |
          uv run --locked python -c 'import json,os,platform,sys; from rdkit import rdBase; print(json.dumps(dict(commit=os.environ["GITHUB_SHA"],run=os.environ["GITHUB_RUN_ID"],host=platform.platform(),machine=platform.machine(),python=sys.version,rdkit=rdBase.rdkitVersion),indent=2))' > capture-provenance.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abbreviation-geometry-${{ matrix.system }}-${{ matrix.arch }}
          path: |
            src/chemistry/abbreviations/geometry-${{ matrix.system }}-${{ matrix.arch }}.json
            capture-provenance.json
          if-no-files-found: error
          retention-days: 30
