name: Documentation
on:
  push:
    branches: [main]
    paths: ["docs/**", "website/**", "package.json", "bun.lock", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "website/**", "package.json", "bun.lock", ".github/workflows/docs.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run docs:check
      - run: bun run docs:build
      # The browser editor demo is built by release.yml, not here: it needs the
      # Rust toolchain. Without a web-demo release the site has no /demo/.
      - name: Add the browser editor demo
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Only a missing release or asset skips the demo; any other error
          # fails, so a lookup error cannot deploy the site without it.
          if ! assets=$(gh release view web-demo --json assets -q '.assets[].name' 2> "$RUNNER_TEMP/error"); then
            cat "$RUNNER_TEMP/error" >&2
            grep -qx 'release not found' "$RUNNER_TEMP/error" || exit 1
            assets=""
          fi
          if ! grep -qx reshiki-web-demo.tar.gz <<< "$assets"; then
            echo "::notice::No reshiki-web-demo.tar.gz in a web-demo release; the site has no /demo/."
            exit 0
          fi
          gh release download web-demo -p reshiki-web-demo.tar.gz -D "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/reshiki-web-demo.tar.gz" -C website/dist
          test -f website/dist/demo/index.html
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: website/dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
