name: Nightly builds

on:
  schedule:
    # 03:37 Japan time. Scheduled workflows run from the default branch, main.
    - cron: "37 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  UV_PYTHON_PREFERENCE: only-managed
jobs:
  packages:
    if: github.ref == 'refs/heads/main'
    # The reused stable workflow declares publication jobs, skipped for nightlies,
    # and GitHub refuses to start it unless the caller grants what they declare:
    # actions: write for web_demo and id-token: write for npm. Its build jobs
    # explicitly reduce this to contents: read.
    permissions:
      contents: write
      actions: write
      id-token: write
    uses: ./.github/workflows/release.yml
    # Required for the reusable signing jobs to resolve their environment secrets.
    secrets: inherit
    with:
      nightly: true
      sign_windows: ${{ vars.SIGNPATH_NIGHTLY_ENABLED == 'true' || vars.SIGNPATH_NIGHTLY_TEST_ENABLED == 'true' }}
      # Production takes precedence. Test signatures remain CI artifacts;
      # public downloads continue to use the qualified unsigned Windows build.
      windows_signing_policy: ${{ vars.SIGNPATH_NIGHTLY_ENABLED == 'true' && 'release-signing' || 'test-signing' }}

  publish:
    needs: packages
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.packages.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - &actions_runtime
        name: Patch the Actions Node runtime when needed
        id: actions_runtime_guard
        shell: pwsh
        run: |
          # Embedded before checkout; setup-node does not change JavaScript actions' Node.
          $ErrorActionPreference = 'Stop'
          $workers = @(Get-Process -Name Runner.Worker -ErrorAction Stop)
          if ($workers.Count -ne 1) { throw 'Expected exactly one live Runner.Worker.' }
          $root = Split-Path (Split-Path $workers[0].Path -Parent) -Parent
          $name = if ($IsWindows) { 'node.exe' } else { 'node' }
          $node = Join-Path $root "externals/node24/bin/$name"
          $version = & $node --version
          if ($LASTEXITCODE -ne 0 -or $version -cnotmatch '^v24\.[0-9]+\.[0-9]+$') {
              throw 'Could not read the active runner Node 24 version.'
          }
          Write-Host "Actions runtime before bootstrap: $version ($node)"
          if ([version] $version.Substring(1) -lt [version] '24.22.1') {
              # Official signed SHASUMS256.txt provenance is in actions_node_bootstrap.json.
              $assets = @{
                  'macOS-ARM64' = @('node-v24.22.1-darwin-arm64.tar.gz', '89c682593d76cd44233fa53b1563264e7de9cbb189cad169135c5b4fadfbc0a7')
                  'macOS-X64' = @('node-v24.22.1-darwin-x64.tar.gz', 'd132557e7ee2b85af08b0c8c34338e65c6430f2238d01f727728ef42dc83b035')
                  'Linux-ARM64' = @('node-v24.22.1-linux-arm64.tar.gz', '33c37be234ba8bee041961047b19160f4d7d0f164e8e246f78bdd10feff148b3')
                  'Linux-X64' = @('node-v24.22.1-linux-x64.tar.gz', 'eb6728e77c576a35162c122c45ccadf224d89ff00abc8dae46cc2897c6002d7c')
                  'Windows-ARM64' = @('win-arm64/node.exe', '8bea91dc437fe01e7d92ef0efc6c9eaf654369aaba9b2d3e9841552ea7b95a00')
                  'Windows-X64' = @('win-x64/node.exe', 'd702daa815eabbff763c7d3808e235cf031cf2ca70211b56847bc72f51e240e5')
              }
              $asset = $assets["$env:RUNNER_OS-$env:RUNNER_ARCH"]
              if ($null -eq $asset) { throw 'Unsupported runner OS/architecture.' }
              $temporary = Join-Path $env:RUNNER_TEMP ('reshiki-node-' + [Guid]::NewGuid())
              New-Item -ItemType Directory -Path $temporary | Out-Null
              try {
                  $download = Join-Path $temporary 'node-download'
                  Invoke-WebRequest -Uri "https://nodejs.org/dist/v24.22.1/$($asset[0])" -OutFile $download
                  if ((Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash -ine $asset[1]) {
                      throw 'Official Node artifact SHA256 mismatch.'
                  }
                  if ($IsWindows) {
                      $candidate = $download # The pinned Windows asset is the raw node.exe.
                  } else {
                      & tar -xzf $download -C $temporary
                      if ($LASTEXITCODE -ne 0) { throw 'Official Node archive extraction failed.' }
                      $candidate = Join-Path $temporary ($asset[0].Replace('.tar.gz', '') + '/bin/node')
                  }
                  Copy-Item -LiteralPath $candidate -Destination $node -Force
              } finally {
                  Remove-Item -LiteralPath $temporary -Recurse -Force
              }
              $version = & $node --version
              if ($LASTEXITCODE -ne 0 -or $version -cne 'v24.22.1') {
                  throw 'The installed Actions Node did not report v24.22.1.'
              }
          }
          Write-Host "Verified Actions runtime: $version ($node)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.12.15"
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: signed-macos-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.packages.outputs.windows_signing_enabled == 'true' && needs.packages.outputs.windows_signing_policy == 'release-signing'
        with:
          pattern: signed-windows-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.packages.outputs.windows_signing_enabled != 'true' || needs.packages.outputs.windows_signing_policy != 'release-signing'
        with:
          pattern: unsigned-windows-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: unsigned-linux-*
          path: release
          merge-multiple: true
      - name: Verify all ten packages and publish a prerelease
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NIGHTLY_VERSION: ${{ needs.packages.outputs.nightly_version }}
          NIGHTLY_COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WINDOWS_SIGNING: ${{ needs.packages.outputs.windows_signing_enabled == 'true' && needs.packages.outputs.windows_signing_policy == 'release-signing' && 'required' || 'unsigned' }}
          WINDOWS_SIGNING_DESCRIPTION: ${{ needs.packages.outputs.windows_signing_enabled == 'true' && needs.packages.outputs.windows_signing_policy == 'release-signing' && 'Windows application executables and installers are signed through SignPath.' || 'Windows packages remain unsigned.' }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          Development build from main at [$NIGHTLY_COMMIT](https://github.com/$GH_REPO/commit/$NIGHTLY_COMMIT).

          Each package includes one application executable, with native chemistry, clipboard and printing workers launched from that same executable, plus five license/notice files. Use copies of drawings when testing. Installers replace an existing ReShiki installation; choose a portable archive in a separate folder to retain Stable.

          Linux 0.9.1 users must download and extract the archive manually because that version's updater expects the retired companion executable.

          macOS applications and disk images are signed with Developer ID, notarized and stapled. $WINDOWS_SIGNING_DESCRIPTION Linux packages remain unsigned.

          Windows includes WGPU and Tiny Skia. Automatic startup uses Direct3D 12 and selects Tiny Skia when only CPU adapters are available. Explicit backend preferences remain available. To force WGPU in PowerShell, set \$env:ICED_BACKEND = 'wgpu' before launching the extracted executable. Run reshiki.exe --graphics-info to inspect available adapters; a CPU adapter is not hardware acceleration.

          Windows installer antivirus detections remain under vendor review. The startup fix and successful package checks do not establish antivirus clearance. See the [Windows security investigation](https://github.com/$GH_REPO/blob/$NIGHTLY_COMMIT/docs/release-0.12.0-windows-security.md) for observed results and limits.

          [Build and package checks]($RUN_URL). The build runners do not establish physical GPU performance. See [the Windows validation guide](https://github.com/$GH_REPO/blob/$NIGHTLY_COMMIT/docs/windows.md) for renderer testing.

          This prerelease is excluded from stable automatic updates. Verify downloads against SHA256SUMS.
          EOF
          uv run --no-project --python 3.12.15 python ../scripts/release_downloads.py --directory . --repository "$GH_REPO" --tag "nightly-$NIGHTLY_VERSION" --notes notes.md --append --windows-signing "$WINDOWS_SIGNING"
          gh release create "nightly-$NIGHTLY_VERSION" --target "$NIGHTLY_COMMIT" \
            --title "Nightly $NIGHTLY_VERSION" --prerelease --latest=false \
            --generate-notes --notes-file notes.md *.zip *.tar.gz *.dmg *-setup.exe SHA256SUMS
