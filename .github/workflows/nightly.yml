name: Nightly builds

on:
  schedule:
    # 03:37 Japan time. Scheduled workflows run from the default branch, main.
    - cron: "37 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  packages:
    if: github.ref == 'refs/heads/main'
    # The reused stable workflow declares a publication job, skipped for nightlies.
    # Its build jobs explicitly reduce this permission to contents: read.
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      nightly: true

  publish:
    needs: packages
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: unsigned-*
          path: release
          merge-multiple: true
      - name: Verify all six packages and publish a prerelease
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NIGHTLY_VERSION: ${{ needs.packages.outputs.nightly_version }}
          NIGHTLY_COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          cat *.sha256 | tr -d '\r' > SHA256SUMS
          sha256sum --check SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 6
          for platform in macos-arm64 macos-x64 windows-x64 windows-arm64 linux-x64 linux-arm64; do
            test "$(find . -maxdepth 1 -name "reshiki-$NIGHTLY_VERSION-$platform.*.sha256" | wc -l)" -eq 1
          done
          cat > notes.md <<EOF
          Development build from main at [$NIGHTLY_COMMIT](https://github.com/$GH_REPO/commit/$NIGHTLY_COMMIT).

          Download the portable archive for your platform and extract the entire folder. Packages include the native chemistry helper. These test builds are unsigned; macOS packages are not notarized. Keep your stable installation and use copies of drawings when testing.

          Windows includes WGPU and Tiny Skia. Automatic selection uses Tiny Skia when only CPU adapters are available. To force WGPU in PowerShell, set \$env:ICED_BACKEND = 'wgpu' before launching the extracted executable. Run reshiki.exe --graphics-info to inspect available adapters; a CPU adapter is not hardware acceleration.

          [Build and package checks]($RUN_URL). The build runners do not establish physical GPU performance. See [the Windows validation guide](https://github.com/$GH_REPO/blob/$NIGHTLY_COMMIT/docs/windows.md) for renderer testing.

          This prerelease is excluded from stable automatic updates. Verify downloads against SHA256SUMS.
          EOF
          gh release create "nightly-$NIGHTLY_VERSION" --target "$NIGHTLY_COMMIT" \
            --title "Nightly $NIGHTLY_VERSION" --prerelease --latest=false \
            --notes-file notes.md *.zip *.tar.gz SHA256SUMS
