name: Nightly builds

on:
  schedule:
    # 03:37 Japan time. Scheduled workflows run from the default branch, main.
    - cron: "37 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  packages:
    if: github.ref == 'refs/heads/main'
    # The reused stable workflow declares a publication job, skipped for nightlies.
    # Its build jobs explicitly reduce this permission to contents: read.
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release.yml
    # Required for the reusable signing jobs to resolve their environment secrets.
    secrets: inherit
    with:
      nightly: true
      sign_windows: ${{ vars.SIGNPATH_NIGHTLY_ENABLED == 'true' || vars.SIGNPATH_NIGHTLY_TEST_ENABLED == 'true' }}
      # Production takes precedence. Test signatures remain CI artifacts;
      # public downloads continue to use the qualified unsigned Windows build.
      windows_signing_policy: ${{ vars.SIGNPATH_NIGHTLY_ENABLED == 'true' && 'release-signing' || 'test-signing' }}

  publish:
    needs: packages
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.packages.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.3"
          python-version: "3.12"
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: signed-macos-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.packages.outputs.windows_signing_enabled == 'true' && needs.packages.outputs.windows_signing_policy == 'release-signing'
        with:
          pattern: signed-windows-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.packages.outputs.windows_signing_enabled != 'true' || needs.packages.outputs.windows_signing_policy != 'release-signing'
        with:
          pattern: unsigned-windows-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: unsigned-linux-*
          path: release
          merge-multiple: true
      - name: Verify all ten packages and publish a prerelease
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NIGHTLY_VERSION: ${{ needs.packages.outputs.nightly_version }}
          NIGHTLY_COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WINDOWS_SIGNING: ${{ needs.packages.outputs.windows_signing_enabled == 'true' && needs.packages.outputs.windows_signing_policy == 'release-signing' && 'required' || 'unsigned' }}
          WINDOWS_SIGNING_DESCRIPTION: ${{ needs.packages.outputs.windows_signing_enabled == 'true' && needs.packages.outputs.windows_signing_policy == 'release-signing' && 'Windows application executables and installers are signed through SignPath.' || 'Windows packages remain unsigned.' }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          Development build from main at [$NIGHTLY_COMMIT](https://github.com/$GH_REPO/commit/$NIGHTLY_COMMIT).

          Each package includes one application executable, with native chemistry, clipboard and printing workers launched from that same executable, plus five license/notice files. Use copies of drawings when testing. Installers replace an existing ReShiki installation; choose a portable archive in a separate folder to retain Stable.

          Linux 0.9.1 users must download and extract the archive manually because that version's updater expects the retired companion executable.

          macOS applications and disk images are signed with Developer ID, notarized and stapled. $WINDOWS_SIGNING_DESCRIPTION Linux packages remain unsigned.

          Windows includes WGPU and Tiny Skia. Automatic selection uses Tiny Skia when only CPU adapters are available. To force WGPU in PowerShell, set \$env:ICED_BACKEND = 'wgpu' before launching the extracted executable. Run reshiki.exe --graphics-info to inspect available adapters; a CPU adapter is not hardware acceleration.

          [Build and package checks]($RUN_URL). The build runners do not establish physical GPU performance. See [the Windows validation guide](https://github.com/$GH_REPO/blob/$NIGHTLY_COMMIT/docs/windows.md) for renderer testing.

          This prerelease is excluded from stable automatic updates. Verify downloads against SHA256SUMS.
          EOF
          uv run --no-project --python 3.12 python ../scripts/release_downloads.py --directory . --repository "$GH_REPO" --tag "nightly-$NIGHTLY_VERSION" --notes notes.md --append --windows-signing "$WINDOWS_SIGNING"
          gh release create "nightly-$NIGHTLY_VERSION" --target "$NIGHTLY_COMMIT" \
            --title "Nightly $NIGHTLY_VERSION" --prerelease --latest=false \
            --generate-notes --notes-file notes.md *.zip *.tar.gz *.dmg *-setup.exe SHA256SUMS
