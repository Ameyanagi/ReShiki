name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint:js
      - run: npm run format:check
  python:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            python: "3.12"
          - os: windows-2022
            python: cpython-3.12-windows-x86_64-none
          - os: windows-11-arm
            python: cpython-3.12-windows-x86_64-none
          - os: ubuntu-22.04
            python: "3.12"
          - os: ubuntu-24.04-arm
            python: "3.12"
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.3"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --locked ruff check engine scripts tests
      - run: uv run --locked ruff format --check engine scripts tests
      - run: uv run --locked ty check
      - run: uv run --locked python -m unittest discover -s tests -p 'test_*.py'
  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            python: "3.12"
          - os: windows-2022
            python: cpython-3.12-windows-x86_64-none
          - os: windows-11-arm
            python: cpython-3.12-windows-x86_64-none
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - run: rustup default 1.95.0
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.3"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo check --workspace --all-targets --locked
      - run: cargo test --workspace --locked
