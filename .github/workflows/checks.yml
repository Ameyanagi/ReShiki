name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live_reference:
        description: Run every live RDKit comparison on all three test platforms
        type: boolean
        default: false
      capture_aromatic:
        description: Recapture unchanged aromatic responses and their source provenance
        type: boolean
        default: false
  workflow_call:
    inputs:
      live_reference:
        type: boolean
        default: true
  schedule:
    - cron: "19 3 * * 1"
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  UV_PYTHON_PREFERENCE: only-managed
jobs:
  scope:
    runs-on: ubuntu-22.04
    outputs:
      native: ${{ steps.scope.outputs.native }}
      live: ${{ steps.scope.outputs.live }}
    steps:
      - &actions_runtime
        name: Require a patched GitHub Actions Node runtime
        id: actions_runtime_guard
        shell: pwsh
        env:
          RESHIKI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          RESHIKI_RUNNER_OS: ${{ runner.os }}
          RESHIKI_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          # This exact body is embedded before checkout in every workflow that uses
          # JavaScript actions. tests/test_ci_runtime_policy.py checks that it stays exact.
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          function Assert-NoLinkedPath {
              param([string] $Path)
              $entry = Get-Item -LiteralPath $Path -Force -ErrorAction Stop
              while ($null -ne $entry) {
                  if (($entry.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
                      throw "Refusing a symbolic link/reparse point in runner path: $($entry.FullName)"
                  }
                  $entry = if ($entry -is [IO.DirectoryInfo]) { $entry.Parent } else { $entry.Directory }
              }
          }

          function Get-ActionsNodePath {
              param([string[]] $WorkerPaths)
              if (@($WorkerPaths).Count -ne 1 -or [string]::IsNullOrWhiteSpace($WorkerPaths[0])) {
                  throw 'Expected exactly one live Runner.Worker executable; refusing to use Node from PATH.'
              }
              $worker = $WorkerPaths[0]
              $workerName = if ($IsWindows) { 'Runner.Worker.exe' } else { 'Runner.Worker' }
              if (-not [IO.Path]::IsPathRooted($worker) -or (Split-Path $worker -Leaf) -cne $workerName) {
                  throw "Unexpected Runner.Worker executable: $worker"
              }
              $bin = Split-Path $worker -Parent
              if ((Split-Path $bin -Leaf) -cne 'bin') {
                  throw "Runner.Worker is not in its runner's bin directory: $worker"
              }
              $root = Split-Path $bin -Parent
              $name = if ($IsWindows) { 'node.exe' } else { 'node' }
              $node = [IO.Path]::GetFullPath((Join-Path $root "externals/node24/bin/$name"))
              if (-not (Test-Path -LiteralPath $node -PathType Leaf)) {
                  throw "The active runner has no embedded Node 24: $node"
              }
              Assert-NoLinkedPath -Path $worker
              Assert-NoLinkedPath -Path $node
              return $node
          }

          function Assert-NodeEnvironment {
              # Do not execute an injected module, preload, or alternate internal runtime.
              foreach ($name in @('NODE_OPTIONS', 'NODE_PATH', 'NODE_EXTRA_CA_CERTS', 'NODE_ICU_DATA',
                      'LD_PRELOAD', 'LD_LIBRARY_PATH', 'DYLD_INSERT_LIBRARIES', 'DYLD_LIBRARY_PATH',
                      'OPENSSL_CONF', 'OPENSSL_MODULES')) {
                  if (-not [string]::IsNullOrEmpty([Environment]::GetEnvironmentVariable($name))) {
                      throw "Refusing runtime injection variable: $name"
                  }
              }
              foreach ($name in @('ACTIONS_RUNNER_FORCED_INTERNAL_NODE_VERSION', 'ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION')) {
                  $value = [Environment]::GetEnvironmentVariable($name)
                  if (-not [string]::IsNullOrEmpty($value) -and $value -cne 'node24') {
                      throw "Refusing alternate Actions runtime: $name=$value"
                  }
              }
              if (-not [string]::IsNullOrEmpty($env:ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION) -and
                  $env:ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION -cne 'false') {
                  throw 'Insecure Actions Node fallback is prohibited.'
              }
          }

          function Read-NodeRuntime {
              param([string] $NodePath)
              Assert-NodeEnvironment
              $start = [Diagnostics.ProcessStartInfo]::new($NodePath)
              $start.UseShellExecute = $false
              $start.RedirectStandardOutput = $true
              $start.RedirectStandardError = $true
              $start.ArgumentList.Add('-p')
              $start.ArgumentList.Add('JSON.stringify({execPath:process.execPath,versions:process.versions,platform:process.platform,arch:process.arch})')
              $process = [Diagnostics.Process]::new()
              $process.StartInfo = $start
              try {
                  if (-not $process.Start()) { throw 'Could not start the absolute Node runtime.' }
                  $stdout = $process.StandardOutput.ReadToEndAsync()
                  $stderr = $process.StandardError.ReadToEndAsync()
                  if (-not $process.WaitForExit(10000)) {
                      $process.Kill($true)
                      throw 'Node runtime attestation timed out.'
                  }
                  $reported = $stdout.GetAwaiter().GetResult()
                  if ($process.ExitCode -ne 0 -or $reported.Length -gt 16384 -or
                      $stderr.GetAwaiter().GetResult().Length -ne 0) { throw 'Node runtime attestation failed.' }
                  return $reported | ConvertFrom-Json
              } finally { $process.Dispose() }
          }

          function Assert-HostedNodeContext {
              param([object] $Runtime, [string] $NodePath, [string] $Environment, [string] $OS, [string] $Architecture)
              $platforms = @{ Linux = 'linux'; macOS = 'darwin'; Windows = 'win32' }
              $architectures = @{ X64 = 'x64'; ARM64 = 'arm64' }
              $actualPlatform = if ($IsWindows) { 'win32' } elseif ($IsMacOS) { 'darwin' } else { 'linux' }
              if ($Environment -cne 'github-hosted' -or -not $platforms.ContainsKey($OS) -or
                  -not $architectures.ContainsKey($Architecture) -or $Runtime.platform -cne $platforms[$OS] -or
                  $Runtime.platform -cne $actualPlatform -or $Runtime.arch -cne $architectures[$Architecture]) {
                  throw 'Bootstrap requires explicit matching github-hosted runner.environment/OS/arch metadata.'
              }
              $comparison = if ($IsWindows) { [StringComparison]::OrdinalIgnoreCase } else { [StringComparison]::Ordinal }
              if (-not [string]::Equals([IO.Path]::GetFullPath($Runtime.execPath), $NodePath, $comparison)) {
                  throw 'Original runtime is outside the active runner node24 path.'
              }
          }

          function Get-NodeBootstrapAsset {
              param([string] $Platform, [string] $Architecture)
              # Official v24.22.1 signed SHASUMS256.txt; verification provenance is retained
              # in evidence/security-2026-10-26/bootstrap-audit, not fetched at job runtime.
              $assets = @{
                  'darwin-arm64' = @('node-v24.22.1-darwin-arm64.tar.gz', '89c682593d76cd44233fa53b1563264e7de9cbb189cad169135c5b4fadfbc0a7')
                  'darwin-x64' = @('node-v24.22.1-darwin-x64.tar.gz', 'd132557e7ee2b85af08b0c8c34338e65c6430f2238d01f727728ef42dc83b035')
                  'linux-arm64' = @('node-v24.22.1-linux-arm64.tar.gz', '33c37be234ba8bee041961047b19160f4d7d0f164e8e246f78bdd10feff148b3')
                  'linux-x64' = @('node-v24.22.1-linux-x64.tar.gz', 'eb6728e77c576a35162c122c45ccadf224d89ff00abc8dae46cc2897c6002d7c')
                  'win32-arm64' = @('win-arm64/node.exe', '8bea91dc437fe01e7d92ef0efc6c9eaf654369aaba9b2d3e9841552ea7b95a00')
                  'win32-x64' = @('win-x64/node.exe', 'd702daa815eabbff763c7d3808e235cf031cf2ca70211b56847bc72f51e240e5')
              }
              $key = "$Platform-$Architecture"
              if (-not $assets.ContainsKey($key)) { throw "Unsupported Node platform/architecture: $key" }
              return [pscustomobject] @{ Name = $assets[$key][0]; SHA256 = $assets[$key][1]; Platform = $Platform; Architecture = $Architecture }
          }

          function Assert-NodeArtifactHash {
              param([string] $Path, [string] $SHA256)
              if ($SHA256 -cnotmatch '^[0-9a-f]{64}$' -or
                  (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant() -cne $SHA256) {
                  throw 'Node artifact/staging SHA256 mismatch.'
              }
          }

          function Receive-NodeArtifact {
              param([Net.Http.HttpResponseMessage] $Response, [string] $Destination, [Threading.CancellationToken] $Cancellation)
              if ($Response.StatusCode -ne [Net.HttpStatusCode]::OK -or $Response.Content.Headers.ContentEncoding.Count -ne 0 -or
                  $Response.Content.Headers.ContentLength -gt 134217728) { throw 'Unexpected Node download status/encoding/size.' }
              $source = $Response.Content.ReadAsStreamAsync($Cancellation).GetAwaiter().GetResult()
              $output = [IO.File]::Open($Destination, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write, [IO.FileShare]::None)
              try {
                  $buffer = [byte[]]::new(65536)
                  $total = 0L
                  while (($count = $source.ReadAsync($buffer, 0, $buffer.Length, $Cancellation).GetAwaiter().GetResult()) -gt 0) {
                      $total += $count
                      if ($total -gt 134217728) { throw 'Node download exceeded the byte limit.' }
                      $output.Write($buffer, 0, $count)
                  }
                  if ($total -eq 0 -or ($null -ne $Response.Content.Headers.ContentLength -and
                          $total -ne $Response.Content.Headers.ContentLength)) { throw 'Empty or partial Node download.' }
              } finally { $output.Dispose(); $source.Dispose() }
          }

          function Save-NodeArtifact {
              param([object] $Asset, [string] $Destination)
              $handler = [Net.Http.HttpClientHandler]::new()
              $handler.AutomaticDecompression = [Net.DecompressionMethods]::None
              $handler.AllowAutoRedirect = $false
              $client = [Net.Http.HttpClient]::new($handler)
              $deadline = [Threading.CancellationTokenSource]::new([TimeSpan]::FromSeconds(120))
              $response = $null
              try {
                  $client.Timeout = [TimeSpan]::FromSeconds(120)
                  $uri = [Uri]::new("https://nodejs.org/dist/v24.22.1/$($Asset.Name)")
                  $response = $client.GetAsync($uri, [Net.Http.HttpCompletionOption]::ResponseHeadersRead, $deadline.Token).GetAwaiter().GetResult()
                  Receive-NodeArtifact -Response $response -Destination $Destination -Cancellation $deadline.Token
                  Assert-NodeArtifactHash -Path $Destination -SHA256 $Asset.SHA256
              } finally {
                  if ($null -ne $response) { $response.Dispose() }
                  $deadline.Dispose(); $client.Dispose(); $handler.Dispose()
              }
          }

          function Expand-NodeExecutable {
              param([object] $Asset, [string] $Archive, [string] $Destination)
              Assert-NodeArtifactHash -Path $Archive -SHA256 $Asset.SHA256
              if ($Asset.Platform -ceq 'win32') {
                  [IO.File]::Copy($Archive, $Destination, $false)
                  return
              }
              $prefix = $Asset.Name.Substring(0, $Asset.Name.Length - 7)
              $inputFile = [IO.File]::OpenRead($Archive)
              $gzip = [IO.Compression.GZipStream]::new($inputFile, [IO.Compression.CompressionMode]::Decompress)
              $tar = [System.Formats.Tar.TarReader]::new($gzip)
              $found = $false
              try {
                  while ($null -ne ($entry = $tar.GetNextEntry())) {
                      $name = $entry.Name
                      if (-not $name.StartsWith("$prefix/", [StringComparison]::Ordinal) -or
                          $name.Contains('\') -or $name -match '(^|/)\.\.?(/|$)') { throw 'Unexpected path in Node archive.' }
                      if ($name -cne "$prefix/bin/node") { continue }
                      if ($found -or $entry.EntryType -notin @([System.Formats.Tar.TarEntryType]::RegularFile,
                              [System.Formats.Tar.TarEntryType]::V7RegularFile) -or $entry.Length -le 0 -or
                          $entry.Length -gt 268435456) { throw 'Duplicate, linked, empty or oversized Node archive member.' }
                      $found = $true
                      $output = [IO.File]::Open($Destination, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write, [IO.FileShare]::None)
                      try { $entry.DataStream.CopyTo($output) } finally { $output.Dispose() }
                  }
                  if (-not $found) { throw 'Node archive has no regular bin/node member.' }
              } finally { $tar.Dispose(); $gzip.Dispose(); $inputFile.Dispose() }
              [IO.File]::SetUnixFileMode($Destination, [IO.UnixFileMode]::UserRead -bor [IO.UnixFileMode]::UserWrite -bor
                  [IO.UnixFileMode]::UserExecute -bor [IO.UnixFileMode]::GroupRead -bor [IO.UnixFileMode]::GroupExecute -bor
                  [IO.UnixFileMode]::OtherRead -bor [IO.UnixFileMode]::OtherExecute)
          }

          function Assert-NoActiveNodeTarget {
              param([string] $NodePath)
              foreach ($process in @(Get-Process -Name node -ErrorAction SilentlyContinue)) {
                  if ([string]::IsNullOrEmpty($process.Path)) { throw 'Cannot establish the executable path of an active Node process.' }
                  $comparison = if ($IsWindows) { [StringComparison]::OrdinalIgnoreCase } else { [StringComparison]::Ordinal }
                  if ([string]::Equals([IO.Path]::GetFullPath($process.Path), $NodePath, $comparison)) {
                      throw 'The target Node executable is still active.'
                  }
              }
          }

          function Install-NodeExecutable {
              param([string] $WorkerPath, [string] $NodePath, [string] $OriginalHash, [string] $Staged,
                  [object] $Asset, [string] $StagedHash)
              # Sibling staging ensures the final rename stays on the destination filesystem.
              $siblingName = '.reshiki-node-' + [Guid]::NewGuid().ToString('N') + $(if ($IsWindows) { '.exe' } else { '' })
              $sibling = Join-Path (Split-Path $NodePath -Parent) $siblingName
              try {
                  Assert-NoLinkedPath -Path $Staged
                  Assert-NoLinkedPath -Path $NodePath
                  Assert-NodeArtifactHash -Path $Staged -SHA256 $StagedHash
                  [IO.File]::Copy($Staged, $sibling, $false)
                  Assert-NodeArtifactHash -Path $sibling -SHA256 $StagedHash
                  if (-not $IsWindows) { [IO.File]::SetUnixFileMode($sibling, [IO.File]::GetUnixFileMode($Staged)) }
                  $candidate = Read-NodeRuntime -NodePath $sibling
                  Assert-ActionsNodeRuntime -Runtime $candidate -NodePath $sibling
                  if ($candidate.versions.node -cne '24.22.1' -or $candidate.platform -cne $Asset.Platform -or
                      $candidate.arch -cne $Asset.Architecture) { throw 'Staged Node has unexpected version/platform/architecture.' }
                  # Re-observe the live worker and both paths immediately before replacement.
                  $live = @(Get-Process -Name Runner.Worker -ErrorAction Stop | ForEach-Object { $_.Path })
                  if ($live.Count -ne 1 -or $live[0] -cne $WorkerPath -or
                      (Get-ActionsNodePath -WorkerPaths $live) -cne $NodePath) { throw 'The active runner changed during bootstrap.' }
                  Assert-NoLinkedPath -Path $sibling
                  Assert-NodeArtifactHash -Path $sibling -SHA256 $StagedHash
                  Assert-NoActiveNodeTarget -NodePath $NodePath
                  Assert-NodeArtifactHash -Path $NodePath -SHA256 $OriginalHash
                  [IO.File]::Move($sibling, $NodePath, $true)
                  Assert-NodeArtifactHash -Path $NodePath -SHA256 $StagedHash
              } finally { if ([IO.File]::Exists($sibling)) { [IO.File]::Delete($sibling) } }
          }

          function Initialize-ActionsNode {
              param([string] $WorkerPath, [string] $NodePath, [object] $Original)
              Assert-HostedNodeContext -Runtime $Original -NodePath $NodePath -Environment $env:RESHIKI_RUNNER_ENVIRONMENT `
                  -OS $env:RESHIKI_RUNNER_OS -Architecture $env:RESHIKI_RUNNER_ARCH
              $oldHash = (Get-FileHash -LiteralPath $NodePath -Algorithm SHA256).Hash.ToLowerInvariant()
              Write-Host "Original Actions runtime: Node $($Original.versions.node), $($Original.platform)/$($Original.arch), SHA256=$oldHash, $NodePath"
              if ($Original.versions.node -cmatch '^24\.[0-9]+\.[0-9]+$' -and [version] $Original.versions.node -ge [version] '24.22.1') {
                  Assert-ActionsNodeRuntime -Runtime $Original -NodePath $NodePath
                  return # Already patched: no download and no filesystem modification.
              }
              if ($Original.versions.node -cne '24.21.0') { throw 'Only the observed compatible Node 24.21.0 runtime may be bootstrapped.' }
              Assert-NoLinkedPath -Path $env:RUNNER_TEMP
              $temporary = Join-Path $env:RUNNER_TEMP ('reshiki-node-' + [Guid]::NewGuid().ToString('N'))
              [IO.Directory]::CreateDirectory($temporary) | Out-Null
              if ($IsWindows) {
                  $security = [Security.AccessControl.DirectorySecurity]::new()
                  $security.SetAccessRuleProtection($true, $false)
                  $identity = [Security.Principal.WindowsIdentity]::GetCurrent().User
                  $rule = [Security.AccessControl.FileSystemAccessRule]::new($identity, 'FullControl', 'ContainerInherit,ObjectInherit', 'None', 'Allow')
                  $security.AddAccessRule($rule)
                  [IO.FileSystemAclExtensions]::SetAccessControl([IO.DirectoryInfo]::new($temporary), $security)
              } else {
                  [IO.File]::SetUnixFileMode($temporary, [IO.UnixFileMode]::UserRead -bor [IO.UnixFileMode]::UserWrite -bor [IO.UnixFileMode]::UserExecute)
              }
              try {
                  $asset = Get-NodeBootstrapAsset -Platform $Original.platform -Architecture $Original.arch
                  $archive = Join-Path $temporary 'download'
                  $staged = Join-Path $temporary $(if ($IsWindows) { 'node.exe' } else { 'node' })
                  Save-NodeArtifact -Asset $asset -Destination $archive
                  Expand-NodeExecutable -Asset $asset -Archive $archive -Destination $staged
                  $newHash = (Get-FileHash -LiteralPath $staged -Algorithm SHA256).Hash.ToLowerInvariant()
                  Install-NodeExecutable -WorkerPath $WorkerPath -NodePath $NodePath -OriginalHash $oldHash -Staged $staged -Asset $asset -StagedHash $newHash
                  $installed = Read-NodeRuntime -NodePath $NodePath
                  Assert-ActionsNodeRuntime -Runtime $installed -NodePath $NodePath
                  if ($installed.versions.node -cne '24.22.1' -or $installed.platform -cne $asset.Platform -or
                      $installed.arch -cne $asset.Architecture) { throw 'Installed Node does not match the authenticated asset.' }
                  Assert-HostedNodeContext -Runtime $installed -NodePath $NodePath -Environment $env:RESHIKI_RUNNER_ENVIRONMENT `
                      -OS $env:RESHIKI_RUNNER_OS -Architecture $env:RESHIKI_RUNNER_ARCH
                  Write-Host "Bootstrapped Actions runtime: Node $($installed.versions.node), $($installed.platform)/$($installed.arch), SHA256=$newHash, $NodePath"
                  # Keep it for post actions; only the ephemeral hosted machine tears it down.
              } finally { Remove-Item -LiteralPath $temporary -Recurse -Force }
          }

          function Assert-ActionsNodeRuntime {
              param([object] $Runtime, [string] $NodePath)
              if ($Runtime.versions.node -cnotmatch '^24\.[0-9]+\.[0-9]+$' -or
                  [version] $Runtime.versions.node -lt [version] '24.22.1') {
                  throw "JavaScript actions require the runner's Node >=24.22.1 (24.x); found $($Runtime.versions.node). Update the runner; setup-node cannot fix this runtime."
              }
              if ($Runtime.versions.brotli -cnotmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
                  throw 'The embedded Node runtime did not report its Brotli version.'
              }
              $comparison = if ($IsWindows) { [StringComparison]::OrdinalIgnoreCase } else { [StringComparison]::Ordinal }
              if (-not [string]::Equals([IO.Path]::GetFullPath($Runtime.execPath), $NodePath, $comparison)) {
                  throw "The inspected runtime is not the active runner's embedded Node: $($Runtime.execPath)"
              }
              # Official Node 24.22.1 backports CVE-2026-111497 while retaining the
              # Brotli 1.2.0 version label. The Node security-release floor is authoritative:
              # https://github.com/nodejs/node/compare/v24.21.0...v24.22.1
              Write-Host "Verified Actions runtime: Node $($Runtime.versions.node), Brotli $($Runtime.versions.brotli), $NodePath"
          }

          Assert-NodeEnvironment
          $workers = @(Get-Process -Name Runner.Worker -ErrorAction Stop | ForEach-Object { $_.Path })
          $node = Get-ActionsNodePath -WorkerPaths $workers
          $original = Read-NodeRuntime -NodePath $node
          Initialize-ActionsNode -WorkerPath $workers[0] -NodePath $node -Original $original
          Assert-ActionsNodeRuntime -Runtime (Read-NodeRuntime -NodePath $node) -NodePath $node
          # Provider initialization/pre-job internals precede this step and remain outside
          # repository coverage. Audited actions must have no runs.pre, even transitively.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: scope
        env:
          CI_LIVE_REFERENCE: ${{ inputs.live_reference || false }}
        run: python3 scripts/ci_scope.py
  dependency-advisories:
    name: Current locked dependency advisories
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - *actions_runtime
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.12.15"
          enable-cache: false
      - run: uv sync --locked
      - name: Query current advisories and enforce the dated exposure guards
        run: uv run --locked python scripts/audit_locked_dependencies.py --project . --output-prefix artifacts/dependency-advisories/locked
      - name: Retain raw matches, responses, lockfiles and dispositions
        if: ${{ always() && steps.actions_runtime_guard.outcome == 'success' && hashFiles('artifacts/dependency-advisories/*') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: locked-dependency-advisories
          path: artifacts/dependency-advisories
          if-no-files-found: error
          retention-days: 14
  web:
    runs-on: ubuntu-22.04
    steps:
      - *actions_runtime
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint:js
      - run: bun run format:check
      - run: bun scripts/check_docs_tree.mjs
  office-addin:
    name: Office add-in JavaScript regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - *actions_runtime
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.4"
          package-manager-cache: false
      - name: Require the Node and TLS test runtimes
        run: |
          node --version
          openssl version
      - name: Run Office add-in and host adapter regressions
        run: node --test integrations/office/*.test.js integrations/office/host-adapters/tests/*.test.js
  python:
    needs: scope
    if: needs.scope.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            python: "3.12.15"
          - os: windows-2022
            python: cpython-3.12.15-windows-x86_64-none
          - os: ubuntu-22.04
            python: "3.12.15"
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - *actions_runtime
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: Exercise the actual Actions runtime guard functions
        shell: pwsh
        run: ./tests/actions_runtime_guard.ps1
      - run: uv run --locked ruff check reference scripts tests
      - run: uv run --locked ruff format --check reference scripts tests
      - run: uv run --locked ty check
      - name: Install Rust for native macOS clipboard and printing checks
        if: runner.os == 'macOS'
        run: rustup toolchain install 1.99.0 --profile minimal && rustup default 1.99.0
      - run: uv run --locked python -m unittest discover -s tests -p 'test_*.py'
      - run: uv run --locked python -m unittest discover -s reference -p 'test_*.py'
      - run: uv run --locked python scripts/check_reference_dependencies.py
  libreoffice-uno:
    name: LibreOffice UNO regressions
    needs: scope
    if: needs.scope.outputs.native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - *actions_runtime
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install matching LibreOffice and Python UNO packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -t noble-backports \
            libreoffice-core-nogui python3-uno
      - name: Record and require a supported LibreOffice runtime
        run: |
          dpkg-query -W libreoffice-core-nogui python3-uno python3
          reshiki_lo_version="$(dpkg-query -W -f='${Version}' libreoffice-core-nogui)"
          dpkg --compare-versions "${reshiki_lo_version#*:}" ge 25.8
      - name: Run all LibreOffice UNO regression tests
        run: /usr/bin/python3 -m unittest discover -s integrations/libreoffice/tests -p 'test_*.py' -v
  linux-x11:
    name: Linux X11 clipboard regressions
    needs: scope
    if: needs.scope.outputs.native == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - *actions_runtime
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the isolated X11 test server and clipboard libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xauth libwayland-dev libxkbcommon-dev pkg-config
      - run: rustup toolchain install 1.99.0 --profile minimal && rustup default 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux-x11
      - name: Run native clipboard regressions serially on a private display
        run: |
          # Tests briefly release their last connection; keep the X server ready.
          xvfb-run -a -s '-screen 0 1024x768x24 -nolisten tcp -noreset' cargo test -p reshiki-linux --lib --locked --no-default-features x11::tests:: -- --ignored --test-threads=1
  rust:
    needs: scope
    if: needs.scope.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            python: "3.12.15"
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            msvc_arch: x64
            python: cpython-3.12.15-windows-x86_64-none
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            python: "3.12.15"
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
      RESHIKI_REQUIRE_INCHI_HELPER: "1"
      # Naming integration must launch this exact source's executable, not a test harness.
      RESHIKI_NAMING_HELPER: ${{ github.workspace }}/target/debug/reshiki${{ endsWith(matrix.target, '-pc-windows-msvc') && '.exe' || '' }}
      # Windows symlink escape tests fail instead of skipping without the privilege.
      RESHIKI_REQUIRE_LINK_TESTS: "1"
    steps:
      - *actions_runtime
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libfontconfig1-dev libudev-dev
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - run: rustup default 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: ${{ matrix.python }}
      - name: Select the native Windows compiler
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc
        with:
          arch: ${{ matrix.msvc_arch }}
      - name: Build the Rust helper and test executable
        run: uv run --no-project python scripts/build_inchi_helper.py --target ${{ matrix.target }}
      - name: Select the helper for runtime integration tests
        run: uv run --no-project python -c "import os,pathlib; p=pathlib.Path('artifacts/inchi-helper/reshiki-inchi-helper'+('.exe' if os.name=='nt' else '')).resolve(); open(os.environ['GITHUB_ENV'],'a').write('RESHIKI_INCHI_HELPER='+str(p)+'\n')"
      - name: Check Rust heap and byte protocol boundaries
        run: uv run --no-project --with certifi==2026.10.23 python -m unittest tests.test_inchi_helper_protocol tests.test_inchi_helper_builder tests.test_inchi_distribution
      - run: cargo fmt --all --check
      - name: Check the native application without reference dependencies
        run: cargo clippy --workspace --all-targets --locked --no-default-features -- -D warnings
      - run: cargo check --workspace --all-targets --locked --no-default-features
      - name: Build the exact application for local naming worker tests
        run: cargo build --locked --no-default-features --bin reshiki
      - name: Audit agent API dependencies for every release target
        # cargo tree resolves all six release triples from one host.
        if: runner.os == 'macOS'
        run: uv run --no-project python scripts/check_agent_dependencies.py
      - name: Test rendered numeric-field focus on Windows
        if: runner.os == 'Windows'
        # The Windows renderer includes Tiny Skia when WGPU is unavailable.
        # This checks widget layout/input; it is not native desktop acceptance.
        run: cargo test --locked --no-default-features --bin reshiki app::numeric_transforms::focus::tests::handle_shortcut_focuses_selects_and_reveals_the_field_in_both_window_sizes -- --exact --ignored
      - name: Capture rendered Help QA on Windows
        if: runner.os == 'Windows'
        # Real Windows font/key rendering, including the TinySkia fallback.
        # Native desktop input acceptance is recorded separately.
        env:
          RESHIKI_HELP_QA_DIR: artifacts/qa-help-polish
          RESHIKI_DATA_DIR: ${{ runner.temp }}/reshiki-help-polish
        run: cargo test --locked --no-default-features --bin reshiki app::help::tests::help_renderer_evidence -- --exact --ignored
      - name: Retain Windows Help renderer evidence
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qa-help-polish-${{ matrix.target }}
          path: artifacts/qa-help-polish
          if-no-files-found: error
      - name: Test rendered cascading menus on Windows
        if: runner.os == 'Windows'
        # The headless renderer falls back to TinySkia on Windows. These
        # exercise widget input and layout, not native OS acceptance.
        run: "cargo test --locked --no-default-features --bin reshiki app::context_menu::cascade_tests:: -- --ignored"
      - name: Test rendered Updates modal keyboard input on Windows
        if: runner.os == 'Windows'
        # The Windows renderer includes Tiny Skia when WGPU is unavailable.
        # This checks widget layout/input; it is not native desktop acceptance.
        run: cargo test --locked --no-default-features --bin reshiki app::shortcut_focus_tests::updates_ -- --ignored
      - name: Test rendered tool flyout input ownership on Windows
        if: runner.os == 'Windows'
        # Exercise the actual application widgets, including the Tiny Skia fallback.
        # Native desktop timing and accessibility acceptance remain separate.
        run: cargo test --locked --no-default-features --bin reshiki app::shortcut_focus_tests::tool_palette_pointer_gestures_and_keyboard_activation_have_one_owner -- --exact --ignored
      - name: Test rendered drop-down Escape on Windows
        if: runner.os == 'Windows'
        # Escape closes the status-bar journal and theme lists (#336).
        run: cargo test --locked --no-default-features --bin reshiki appearance::tests::escape_closes_an_open_pick_list -- --exact --ignored
      - name: Test rendered figure export labels on Windows
        if: runner.os == 'Windows'
        # Keep the renderer-dependent AX check explicit; ordinary menu state
        # regressions run on all hosts without requiring a graphics adapter.
        run: cargo test --locked --no-default-features --bin reshiki app::inspector::tests::figure_export_buttons_publish_readable_labels -- --exact --ignored
      - name: Test rendered hybrid NMR controls on Windows
        if: runner.os == 'Windows'
        # Actual shared widgets, plot/atom linkage, docking camera and owned
        # drag/resize input. Native desktop acceptance is recorded separately.
        run: |
          cargo test --locked --no-default-features --bin reshiki app::nmr:: -- --include-ignored --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --no-default-features --bin reshiki canvas::nmr:: -- --include-ignored --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test rendered local naming accessibility and scrolled insertion on Windows
        if: runner.os == 'Windows'
        run: "cargo test --locked --no-default-features --bin reshiki app::naming:: -- --ignored"
      # Required workspace tests include independent expected-name rules, exact
      # native OPSIN reconstruction and cancellation/resource/missing-helper cases.
      - run: cargo test --workspace --locked --no-default-features
      - name: Test the isolated font export probe
        run: cargo test --locked --manifest-path tools/font-export-probe/Cargo.toml -j 2
      - name: Test public SciFinder fixtures on a one-megabyte stack
        run: cargo test --locked --no-default-features --example scifinder_handoff_qa tests::public_fixture_checks_fit_one_megabyte_stack -- --exact
      - name: Verify public SciFinder handoff fixtures
        run: cargo run --locked --no-default-features --example scifinder_handoff_qa -- "${{ runner.temp }}/reshiki-scifinder-handoff"
      - name: Install fixture reader dependencies
        run: uv sync --locked
      - name: Check all optional reference tests compile cleanly
        run: cargo clippy --workspace --all-targets --locked --features rdkit-reference -- -D warnings
      - name: Select the captured Ubuntu fixture profile
        if: runner.os == 'Linux'
        run: echo "RESHIKI_TEST_LINUX_GOLDENS=ubuntu-22.04-x64" >> "$GITHUB_ENV"
      - name: Replay independently captured chemistry fixtures
        run: cargo test --locked --features rdkit-reference --test inchi_reader --test depict_geometry --test depict_rings --test depict_attachment --test depict_seeds --test depict_templates --test depict_collision --test depict_expansion --test depict_finalize --no-fail-fast
      - name: Replay complete aromatic response fixtures
        run: cargo test --locked --features rdkit-reference --test native_aromatic complete_aromatic_responses_match_goldens -- --exact
  # The browser build: the editor and the headless library for wasm32, as
  # scripts/build_wasm.sh builds them, and the packages/editor tests. The
  # tests load an unoptimised debug build; only releases build the bundle.
  browser:
    name: Browser build (wasm32)
    needs: scope
    if: needs.scope.outputs.native == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - *actions_runtime
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: rustup toolchain install 1.99.0 --profile minimal --component clippy --target wasm32-unknown-unknown
      - run: rustup default 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: wasm32
      - name: Check the browser editor, its worker and the headless library for wasm32
        run: cargo clippy -p reshiki-web -p reshiki -p reshiki-web-worker --lib --bin reshiki --target wasm32-unknown-unknown --locked -- -D warnings
      - name: Build the headless library for the package tests
        run: |
          version=$(awk '$0 == "name = \"wasm-bindgen\"" { getline; gsub(/"/, "", $3); print $3 }' Cargo.lock)
          cargo install wasm-bindgen-cli --version "$version" --locked
          cargo build -p reshiki-web --lib --target wasm32-unknown-unknown --locked
          wasm-bindgen --target web --out-dir packages/editor/dist/wasm target/wasm32-unknown-unknown/debug/reshiki_web.wasm
      - name: Test the browser package
        working-directory: packages/editor
        run: bun test
  geometry:
    name: Rust geometry (${{ matrix.target }})
    needs: scope
    if: needs.scope.outputs.native == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            msvc_arch: x64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            msvc_arch: arm64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      # Keep the packaged Windows executable independent of redistributable CRT DLLs.
      RUSTFLAGS: ${{ endsWith(matrix.target, '-pc-windows-msvc') && '-C target-feature=+crt-static' || '' }}
    steps:
      - *actions_runtime
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select the matching native Rust host
        run: rustup set default-host ${{ matrix.target }}
      - run: rustup toolchain install 1.99.0 --profile minimal --target ${{ matrix.target }}
      - run: rustup default 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: geometry-${{ matrix.target }}
      - name: Select the native Windows compiler
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc
        with:
          arch: ${{ matrix.msvc_arch }}
      - name: Test native heap allocation and panic unwinding
        run: cargo test --release --locked -p reshiki-process-heap --no-default-features --target ${{ matrix.target }}
      - name: Test panic unwinding through the measured application heap
        run: cargo test --release --locked -p reshiki-process-heap --no-default-features --features allocation-metrics --test global_allocator_unwind --target ${{ matrix.target }}
      - name: Test the Rust geometry crate with the locked COSMolKit source
        run: cargo test --locked -p reshiki-geometry --features cosmolkit/op-contracts-strict --target ${{ matrix.target }}
      - name: Compare abbreviation layouts with the frozen RDKit captures
        # The catalog lays groups out with the native depiction port at run
        # time; this replaces the former per-platform capture workflow.
        run: "cargo test --locked -p reshiki-model --lib --target ${{ matrix.target }} chemistry::abbreviations::"
      - name: Check native Rust naming backend and process portability
        run: cargo check --locked -p opsin -p reshiki-process --all-targets --target ${{ matrix.target }}
      - name: Test the native Rust naming backend and process limits on the matching host
        run: cargo test --locked -p opsin -p reshiki-process --target ${{ matrix.target }}
  reference:
    needs: scope
    if: needs.scope.outputs.live == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
        platform:
          - os: macos-14
            target: aarch64-apple-darwin
            python: "3.12.15"
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            msvc_arch: x64
            python: cpython-3.12.15-windows-x86_64-none
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            python: "3.12.15"
    runs-on: ${{ matrix.platform.os }}
    env:
      UV_PYTHON: ${{ matrix.platform.python }}
      RESHIKI_REQUIRE_INCHI_HELPER: "1"
      # Shard 0 runs the workspace library and app tests, whose local naming
      # worker tests need this exact source's built executable.
      RESHIKI_NAMING_HELPER: ${{ github.workspace }}/target/debug/reshiki${{ endsWith(matrix.platform.target, '-pc-windows-msvc') && '.exe' || '' }}
    steps:
      - *actions_runtime
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libfontconfig1-dev libudev-dev
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - run: rustup default 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: reference-${{ matrix.shard }}
          cache-on-failure: true
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: ${{ matrix.platform.python }}
      - name: Select the native Windows compiler
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc
        with:
          arch: ${{ matrix.platform.msvc_arch }}
      - name: Build the Rust helper and test executable
        run: uv run --no-project python scripts/build_inchi_helper.py --target ${{ matrix.platform.target }}
      - name: Select the helper for runtime integration tests
        run: uv run --no-project python -c "import os,pathlib; p=pathlib.Path('artifacts/inchi-helper/reshiki-inchi-helper'+('.exe' if os.name=='nt' else '')).resolve(); open(os.environ['GITHUB_ENV'],'a').write('RESHIKI_INCHI_HELPER='+str(p)+'\n')"
      - name: Install the optional reference dependencies
        run: uv sync --locked
      - name: Build live Linux depiction observers for the installed reference wheel
        if: runner.os == 'Linux'
        run: uv run --locked python scripts/setup_linux_depict_reference.py
      - name: Select x64 MSVC for the original Windows reference wheel
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc
        with:
          arch: x64
      - name: Build live Windows depiction observers for the installed reference wheel
        if: runner.os == 'Windows'
        run: uv run --locked python scripts/setup_windows_depict_reference.py
      - name: Restore the native Windows compiler for Rust tests
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc
        with:
          arch: ${{ matrix.platform.msvc_arch }}
      - name: Build the exact application for local naming worker tests
        if: matrix.shard == 0
        run: cargo build --locked --features rdkit-reference --bin reshiki
      - name: Run every assigned reference target
        run: uv run --locked python scripts/run_reference_shard.py --index ${{ matrix.shard }} --count 4
      - name: Preserve shard results and failed comparisons
        if: ${{ always() && steps.actions_runtime_guard.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reference-${{ matrix.platform.target }}-${{ matrix.shard }}
          path: |
            artifacts/reference-shard-*.json
            artifacts/*-actual.json
            artifacts/*-expected.json
            artifacts/*-engine-failures.txt
            artifacts/native-import-*-failures.log
            artifacts/depict-live-windows/*.json*
            artifacts/depict-live-windows/*.log
            artifacts/depict-windows-*/compiler.log
          if-no-files-found: ignore
          retention-days: 7
  capture-aromatic:
    if: github.event_name == 'workflow_dispatch' && inputs.capture_aromatic
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            fixture: macos
            python: "3.12.15"
          - os: windows-2022
            fixture: windows
            python: cpython-3.12.15-windows-x86_64-none
          - os: ubuntu-22.04
            fixture: linux
            python: "3.12.15"
    runs-on: ${{ matrix.os }}
    steps:
      - *actions_runtime
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: Restore the historical template inputs used by the captured requests
        run: uv run --locked python -c "import gzip,pathlib; pathlib.Path('assets/templates.json').write_bytes(gzip.decompress(pathlib.Path('tests/fixtures/aromatic-template-inputs.json.gz').read_bytes()))"
      - name: Capture original worker responses on this platform
        run: uv run --locked python reference/native_aromatic_reference.py --requests tests/fixtures/native-aromatic-${{ matrix.fixture }}.json.gz --output artifacts/native-aromatic-${{ matrix.fixture }}.json.gz
      - name: Require every recorded request and response to remain unchanged
        run: uv run --locked python -c "import gzip,json; old=json.loads(gzip.open('tests/fixtures/native-aromatic-${{ matrix.fixture }}.json.gz','rt').readline()); new=json.loads(gzip.open('artifacts/native-aromatic-${{ matrix.fixture }}.json.gz','rt').readline()); assert old['records_sha256']==new['records_sha256'], 'Responses changed; review the differences before accepting new fixtures'"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aromatic-capture-${{ matrix.fixture }}
          path: artifacts/native-aromatic-${{ matrix.fixture }}.json.gz
          if-no-files-found: error
