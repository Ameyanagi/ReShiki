name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live_reference:
        description: Run every live RDKit comparison on all three test platforms
        type: boolean
        default: false
      capture_aromatic:
        description: Recapture unchanged aromatic responses and their source provenance
        type: boolean
        default: false
  workflow_call:
    inputs:
      live_reference:
        type: boolean
        default: true
  schedule:
    - cron: "19 3 * * 1"
permissions:
  contents: read
concurrency:
  # Manual and scheduled runs (the live reference suite) do not queue behind a
  # push run of the same branch; the 2026-11-13 live run waited 35 minutes.
  group: checks-${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.run_id || 'ref' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  UV_PYTHON_PREFERENCE: only-managed
  # Smaller test binaries and caches; panics keep file and line numbers.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
jobs:
  scope:
    runs-on: ubuntu-22.04
    outputs:
      native: ${{ steps.scope.outputs.native }}
      live: ${{ steps.scope.outputs.live }}
      geometry: ${{ steps.scope.outputs.geometry }}
      # macOS legs run only on stacked merge/* PRs, full-ci-labelled PRs, main,
      # nightly, release and manual runs; `matrix` (scripts/ci_scope.py) leaves
      # their rows out otherwise, so no macOS runner is taken.
      macos: ${{ steps.scope.outputs.macos }}
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - &actions_runtime
        name: Patch the Actions Node runtime when needed
        id: actions_runtime_guard
        shell: pwsh
        run: |
          # Embedded before checkout; setup-node does not change JavaScript actions' Node.
          $ErrorActionPreference = 'Stop'
          $workers = @(Get-Process -Name Runner.Worker -ErrorAction SilentlyContinue)
          $containerJob = $workers.Count -eq 0 -and -not $IsWindows -and (Test-Path -LiteralPath '/__e/node24/bin/node' -PathType Leaf)
          if ($containerJob) {
              $node = '/__e/node24/bin/node'
          } else {
              if ($workers.Count -ne 1) { throw 'Expected exactly one live Runner.Worker.' }
              $root = Split-Path (Split-Path $workers[0].Path -Parent) -Parent
              $name = if ($IsWindows) { 'node.exe' } else { 'node' }
              $node = Join-Path $root "externals/node24/bin/$name"
          }
          $version = & $node --version
          if ($LASTEXITCODE -ne 0 -or $version -cnotmatch '^v24\.[0-9]+\.[0-9]+$') {
              throw 'Could not read the active runner Node 24 version.'
          }
          Write-Host "Actions runtime before bootstrap: $version ($node)"
          if ([version] $version.Substring(1) -lt [version] '24.22.1') {
              if ($containerJob) {
                  throw 'The read-only /__e runner Node of a container job cannot be patched; run this job without a container.'
              }
              # Official signed SHASUMS256.txt provenance is in actions_node_bootstrap.json.
              $assets = @{
                  'macOS-ARM64' = @('node-v24.22.1-darwin-arm64.tar.gz', '89c682593d76cd44233fa53b1563264e7de9cbb189cad169135c5b4fadfbc0a7')
                  'macOS-X64' = @('node-v24.22.1-darwin-x64.tar.gz', 'd132557e7ee2b85af08b0c8c34338e65c6430f2238d01f727728ef42dc83b035')
                  'Linux-ARM64' = @('node-v24.22.1-linux-arm64.tar.gz', '33c37be234ba8bee041961047b19160f4d7d0f164e8e246f78bdd10feff148b3')
                  'Linux-X64' = @('node-v24.22.1-linux-x64.tar.gz', 'eb6728e77c576a35162c122c45ccadf224d89ff00abc8dae46cc2897c6002d7c')
                  'Windows-ARM64' = @('win-arm64/node.exe', '8bea91dc437fe01e7d92ef0efc6c9eaf654369aaba9b2d3e9841552ea7b95a00')
                  'Windows-X64' = @('win-x64/node.exe', 'd702daa815eabbff763c7d3808e235cf031cf2ca70211b56847bc72f51e240e5')
              }
              $asset = $assets["$env:RUNNER_OS-$env:RUNNER_ARCH"]
              if ($null -eq $asset) { throw 'Unsupported runner OS/architecture.' }
              $temporary = Join-Path $env:RUNNER_TEMP ('reshiki-node-' + [Guid]::NewGuid())
              New-Item -ItemType Directory -Path $temporary | Out-Null
              try {
                  $download = Join-Path $temporary 'node-download'
                  Invoke-WebRequest -Uri "https://nodejs.org/dist/v24.22.1/$($asset[0])" -OutFile $download
                  if ((Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash -ine $asset[1]) {
                      throw 'Official Node artifact SHA256 mismatch.'
                  }
                  if ($IsWindows) {
                      $candidate = $download # The pinned Windows asset is the raw node.exe.
                  } else {
                      & tar -xzf $download -C $temporary
                      if ($LASTEXITCODE -ne 0) { throw 'Official Node archive extraction failed.' }
                      $candidate = Join-Path $temporary ($asset[0].Replace('.tar.gz', '') + '/bin/node')
                  }
                  Copy-Item -LiteralPath $candidate -Destination $node -Force
              } finally {
                  Remove-Item -LiteralPath $temporary -Recurse -Force
              }
              $version = & $node --version
              if ($LASTEXITCODE -ne 0 -or $version -cne 'v24.22.1') {
                  throw 'The installed Actions Node did not report v24.22.1.'
              }
          }
          Write-Host "Verified Actions runtime: $version ($node)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: scope
        env:
          CI_LIVE_REFERENCE: ${{ inputs.live_reference || false }}
        run: python3 scripts/ci_scope.py
  images:
    needs: scope
    if: needs.scope.outputs.native == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci-images.yml
  # A fixture or baseline update is hard to review in the file diff, so the
  # job summary lists the rows each changed fixture gains and loses.
  fixtures:
    name: Changed fixture rows
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - *actions_runtime
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: List the changed fixture rows in the job summary
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/baseline_summary.py "$BASE"
  web:
    runs-on: ubuntu-22.04
    steps:
      - *actions_runtime
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint:js
      - run: bun run format:check
      - run: bun scripts/check_docs_tree.mjs
  office-addin:
    name: Office add-in JavaScript regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - *actions_runtime
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.4"
          package-manager-cache: false
      - name: Require the Node and TLS test runtimes
        run: |
          node --version
          openssl version
      - name: Run Office add-in and host adapter regressions
        run: node --test integrations/office/*.test.js integrations/office/host-adapters/tests/*.test.js
  python:
    needs: scope
    if: needs.scope.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.matrix).python }}
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - *actions_runtime
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --locked ruff check reference scripts tests
      - run: uv run --locked ruff format --check reference scripts tests
      - run: uv run --locked ty check
      - run: uv run --locked python -m unittest discover -s tests -p 'test_*.py'
      - run: uv run --locked python -m unittest discover -s reference -p 'test_*.py'
      - run: uv run --locked python scripts/check_reference_dependencies.py
  python-package:
    name: Python package (headless wheel)
    needs: scope
    if: needs.scope.outputs.native == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - *actions_runtime
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.99.1 --profile minimal && rustup default 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: python-package
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.12.15"
      - name: Generate wheel license notices
        run: uv run --no-project --python 3.12.15 python scripts/license_notices.py
      - name: Build the abi3 wheel
        run: uvx maturin@1.15.0 build --manifest-path crates/python/Cargo.toml --locked --out artifacts/python
      - name: Check wheel license notices
        run: uv run --no-project --python 3.12.15 python scripts/check_python_wheel_notices.py "artifacts/python/*.whl"
      - name: Install test and integration dependencies
        run: uv sync --project crates/python --all-extras --no-install-project
      - name: Test the built wheel
        run: uv run --project crates/python --no-sync --with ./artifacts/python/*.whl --with rdkit pytest crates/python/tests
      - run: uv run --project crates/python --no-sync ruff check crates/python/python crates/python/tests
      - run: uv run --project crates/python --no-sync ruff format --check crates/python/python crates/python/tests
      - run: uv run --project crates/python --no-sync ty check --project crates/python
  libreoffice-uno:
    name: LibreOffice UNO regressions
    needs: [scope, images]
    if: needs.scope.outputs.native == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container: ${{ needs.images.outputs.noble_desktop }}
    # Container steps otherwise default to sh; keep the hosted runner's bash -e.
    defaults:
      run:
        shell: bash -e {0}
    timeout-minutes: 15
    steps:
      - *actions_runtime
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record and require a supported LibreOffice runtime
        run: |
          dpkg-query -W libreoffice-core-nogui python3-uno python3
          reshiki_lo_version="$(dpkg-query -W -f='${Version}' libreoffice-core-nogui)"
          dpkg --compare-versions "${reshiki_lo_version#*:}" ge 25.8
      - name: Run all LibreOffice UNO regression tests
        run: /usr/bin/python3 -m unittest discover -s integrations/libreoffice/tests -p 'test_*.py' -v
  linux-x11:
    name: Linux X11 clipboard regressions
    needs: [scope, images]
    if: needs.scope.outputs.native == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container: ${{ needs.images.outputs.noble }}
    # Container steps otherwise default to sh; keep the hosted runner's bash -e.
    defaults:
      run:
        shell: bash -e {0}
    timeout-minutes: 10
    steps:
      - *actions_runtime
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.99.1 --profile minimal && rustup default 1.99.1
      - name: Run native clipboard regressions serially on a private display
        run: |
          # Tests briefly release their last connection; keep the X server ready.
          xvfb-run -a -s '-screen 0 1024x768x24 -nolisten tcp -noreset' cargo test -p reshiki-linux --lib --locked --no-default-features x11::tests:: -- --ignored --test-threads=1
  # Each platform compiles the workspace tests once. This job archives them for
  # the two `rust` partitions and ends there, so they start as soon as it uploads.
  rust-build:
    name: rust build (${{ matrix.os }}, ${{ matrix.target }}, ${{ matrix.python }})
    needs: [scope, images]
    if: needs.scope.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.matrix).rust }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    # Linux runs in the CI image; an empty string runs the other rows on the host.
    container: ${{ matrix.os == 'ubuntu-24.04' && needs.images.outputs.noble || '' }}
    # Container steps otherwise default to sh; keep each runner's own default shell.
    defaults:
      run:
        shell: ${{ startsWith(matrix.os, 'windows') && 'pwsh' || 'bash -e {0}' }}
    env:
      UV_PYTHON: ${{ matrix.python }}
      RESHIKI_REQUIRE_INCHI_HELPER: "1"
      # Naming integration must launch this exact source's executable, not a test harness.
      RESHIKI_NAMING_HELPER: ${{ github.workspace }}/target/debug/reshiki${{ endsWith(matrix.target, '-pc-windows-msvc') && '.exe' || '' }}
      # Windows symlink escape tests fail instead of skipping without the privilege.
      RESHIKI_REQUIRE_LINK_TESTS: "1"
    steps:
      - *actions_runtime
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: rustup default 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust
          # rust-extra warms and saves this cache.
          save-if: false
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest@0.9.150
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: ${{ matrix.python }}
      - name: Select the native Windows compiler
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc
        with:
          arch: ${{ matrix.msvc_arch }}
      - name: Build the Rust helper and test executable
        run: uv run --no-project python scripts/build_inchi_helper.py
      - name: Select the helper for runtime integration tests
        run: uv run --no-project python -c "import os,pathlib; p=pathlib.Path('artifacts/inchi-helper/reshiki-inchi-helper'+('.exe' if os.name=='nt' else '')).resolve(); open(os.environ['GITHUB_ENV'],'a').write('RESHIKI_INCHI_HELPER='+str(p)+'\n')"
      - name: Build the exact application for local naming worker tests
        run: cargo build --locked --no-default-features --bin reshiki
      - name: Build the workspace tests once for both partitions
        # The archive also holds target/debug/reshiki, which the tests start.
        run: cargo nextest archive --workspace --locked --no-default-features --archive-file nextest-archive.tar.zst
      - name: Pack the helpers with their executable bits
        run: tar -cf inchi-helper.tar artifacts/inchi-helper
      - name: Hand the built tests to the partitions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextest-archive-${{ matrix.target }}
          path: |
            nextest-archive.tar.zst
            inchi-helper.tar
          if-no-files-found: error
          # Both files are already packed.
          compression-level: 0
          retention-days: 1
          # A re-run of this job replaces the archive of the earlier attempt.
          overwrite: true
  # The tests that nextest does not run in the partitions: ignored renderer
  # tests, one-process and custom harnesses, doc tests and the fixture checks.
  # It compiles what it needs itself, so it runs beside rust-build and the
  # partitions and none of them waits for another.
  rust-extra:
    name: rust extra (${{ matrix.os }}, ${{ matrix.target }}, ${{ matrix.python }})
    needs: [scope, images]
    if: needs.scope.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.matrix).rust }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    # Linux runs in the CI image; an empty string runs the other rows on the host.
    container: ${{ matrix.os == 'ubuntu-24.04' && needs.images.outputs.noble || '' }}
    # Container steps otherwise default to sh; keep each runner's own default shell.
    defaults:
      run:
        shell: ${{ startsWith(matrix.os, 'windows') && 'pwsh' || 'bash -e {0}' }}
    env:
      UV_PYTHON: ${{ matrix.python }}
      RESHIKI_REQUIRE_INCHI_HELPER: "1"
      # Naming integration must launch this exact source's executable, not a test harness.
      RESHIKI_NAMING_HELPER: ${{ github.workspace }}/target/debug/reshiki${{ endsWith(matrix.target, '-pc-windows-msvc') && '.exe' || '' }}
      # Windows symlink escape tests fail instead of skipping without the privilege.
      RESHIKI_REQUIRE_LINK_TESTS: "1"
    steps:
      - *actions_runtime
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.99.1 --profile minimal --component clippy
      - run: rustup default 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        if: runner.os == 'Windows'
        with:
          tool: cargo-nextest@0.9.150
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: ${{ matrix.python }}
      - name: Select the native Windows compiler
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc
        with:
          arch: ${{ matrix.msvc_arch }}
      - name: Build the Rust helper and test executable
        run: uv run --no-project python scripts/build_inchi_helper.py
      - name: Select the helper for runtime integration tests
        run: uv run --no-project python -c "import os,pathlib; p=pathlib.Path('artifacts/inchi-helper/reshiki-inchi-helper'+('.exe' if os.name=='nt' else '')).resolve(); open(os.environ['GITHUB_ENV'],'a').write('RESHIKI_INCHI_HELPER='+str(p)+'\n')"
      - name: Build the exact application for local naming worker tests
        run: cargo build --locked --no-default-features --bin reshiki
      - name: Check Rust heap and byte protocol boundaries
        run: uv run --no-project --with certifi==2026.10.23 python -m unittest tests.test_inchi_helper_protocol tests.test_inchi_helper_builder tests.test_inchi_distribution
      - name: Audit agent API dependencies for every release target
        # cargo tree resolves all six release triples from one host.
        if: runner.os == 'macOS'
        run: uv run --no-project python scripts/check_agent_dependencies.py
      - name: Test with the real renderer on Windows
        if: runner.os == 'Windows'
        # Every ignored test of the application binary runs here unless its name
        # starts with manual_ or ends in _child, and so do the root library's
        # accessibility tests (docs/development.md, "Opt-in renderer tests").
        # The Windows renderer includes Tiny Skia when WGPU is unavailable. These
        # check widget layout, input and accessibility; native desktop acceptance
        # is recorded separately.
        env:
          RESHIKI_DATA_DIR: ${{ runner.temp }}/reshiki-renderer-tests
          # help_renderer_evidence keeps its captures for review.
          RESHIKI_HELP_QA_DIR: artifacts/qa-help-polish
        run: >-
          cargo nextest run --locked --no-default-features --lib --bin reshiki --profile ci
          --run-ignored ignored-only --test-threads 2
          -E '(binary_id(reshiki::bin/reshiki) & not test(/(^|::)manual_[^:]+$/) & not test(/_child$/))
          | (package(reshiki) & kind(lib) & test(/^accessibility::tests::/))'
      - name: Test the shared naming corpus in one libtest process
        # Preserve the shared LazyLock baseline.
        run: "cargo test --locked --no-default-features -p reshiki --lib naming::s2n_harness::"
      - name: Test the custom metafile worker harness
        run: cargo test --locked --no-default-features --test metafile_worker
      - name: Test the custom native print harness
        # Cargo also runs this target's no-op main on non-macOS hosts.
        run: cargo test --locked --no-default-features -p reshiki-macos --test native_print
      - name: Test workspace documentation
        run: cargo test --workspace --locked --no-default-features --doc
      - name: Test the isolated font export probe
        run: cargo test --locked --manifest-path tools/font-export-probe/Cargo.toml -j 2
      - name: Test public SciFinder fixtures on a one-megabyte stack
        run: cargo test --locked --no-default-features --example scifinder_handoff_qa tests::public_fixture_checks_fit_one_megabyte_stack -- --exact
      - name: Verify public SciFinder handoff fixtures
        run: cargo run --locked --no-default-features --example scifinder_handoff_qa -- "${{ runner.temp }}/reshiki-scifinder-handoff"
      - name: Warm the shared Rust cache
        if: github.ref == 'refs/heads/main'
        # Include lint and golden configurations for all three lanes' PR cache reads.
        # Keep the job's shell: Git Bash's /usr/bin/link shadows MSVC link.exe on Windows.
        run: >-
          cargo clippy --workspace --all-targets --locked --no-default-features &&
          cargo clippy --workspace --all-targets --locked --features rdkit-reference &&
          cargo test --locked --features rdkit-reference --no-run --test inchi_reader --test depict_geometry --test depict_rings --test depict_attachment --test depict_seeds --test depict_templates --test depict_collision --test depict_expansion --test depict_finalize --test native_aromatic
  rust:
    name: rust (${{ matrix.platform.os }}, ${{ matrix.platform.target }}, ${{ matrix.platform.python }}, ${{ matrix.partition }}/2)
    needs: [scope, images, rust-build]
    if: needs.scope.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2]
        platform: ${{ fromJSON(needs.scope.outputs.matrix).rust }}
    runs-on: ${{ matrix.platform.os }}
    permissions:
      contents: read
      packages: read
    # Linux runs in the CI image; an empty string runs the other rows on the host.
    container: ${{ matrix.platform.os == 'ubuntu-24.04' && needs.images.outputs.noble || '' }}
    # Container steps otherwise default to sh; keep each runner's own default shell.
    defaults:
      run:
        shell: ${{ startsWith(matrix.platform.os, 'windows') && 'pwsh' || 'bash -e {0}' }}
    env:
      RESHIKI_REQUIRE_INCHI_HELPER: "1"
      # Naming integration must launch this exact source's executable, not a test harness.
      RESHIKI_NAMING_HELPER: ${{ github.workspace }}/target/debug/reshiki${{ endsWith(matrix.platform.target, '-pc-windows-msvc') && '.exe' || '' }}
      # Windows symlink escape tests fail instead of skipping without the privilege.
      RESHIKI_REQUIRE_LINK_TESTS: "1"
    steps:
      - *actions_runtime
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest@0.9.150
      - name: Fetch the tests that rust-build compiled
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nextest-archive-${{ matrix.platform.target }}
      - name: Unpack the helpers
        run: tar -xf inchi-helper.tar
      - name: Select the helper for runtime integration tests
        shell: pwsh
        run: |
          $helper = (Resolve-Path "artifacts/inchi-helper/reshiki-inchi-helper$($IsWindows ? '.exe' : '')").Path
          "RESHIKI_INCHI_HELPER=$helper" >> $env:GITHUB_ENV
      # Required workspace tests include independent expected-name rules, exact
      # native OPSIN reconstruction and cancellation/resource/missing-helper cases.
      - name: Test the native workspace partition
        # Runs the archive without Cargo. --extract-to puts target/debug where
        # the build had it, so paths compiled into the tests still resolve.
        # Binary exclusions also prevent executing custom harnesses during listing.
        run: >-
          cargo-nextest nextest run --archive-file nextest-archive.tar.zst
          --extract-to . --workspace-remap . --profile ci
          --partition hash:${{ matrix.partition }}/2
          -E 'not binary_id(reshiki::metafile_worker) & not binary_id(reshiki-macos::native_print) & not (package(reshiki) & kind(lib) & test(/^naming::s2n_harness::/))'
      - name: Keep the JUnit report of the workspace partition
        if: ${{ always() && steps.actions_runtime_guard.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextest-junit-${{ matrix.platform.target }}-${{ matrix.partition }}
          path: target/nextest/ci/junit.xml
          # An earlier step failed, so nextest wrote no report.
          if-no-files-found: ignore
          retention-days: 7
  # Lint and golden replay share one job per platform to spare macOS runners.
  rust-lint-goldens:
    name: rust lint+goldens (${{ matrix.os }}, ${{ matrix.target }})
    needs: [scope, images]
    if: needs.scope.outputs.native == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.matrix).rust }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    # Linux runs in the CI image; an empty string runs the other rows on the host.
    container: ${{ matrix.os == 'ubuntu-24.04' && needs.images.outputs.noble || '' }}
    # Container steps otherwise default to sh; keep each runner's own default shell.
    defaults:
      run:
        shell: ${{ startsWith(matrix.os, 'windows') && 'pwsh' || 'bash -e {0}' }}
    env:
      UV_PYTHON: ${{ matrix.python }}
      RESHIKI_REQUIRE_INCHI_HELPER: "1"
    steps:
      - *actions_runtime
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: rustup default 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust
          save-if: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: ${{ matrix.python }}
      - name: Select the native Windows compiler
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc
        with:
          arch: ${{ matrix.msvc_arch }}
      - if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Check the native application without reference dependencies
        run: cargo clippy --workspace --all-targets --locked --no-default-features -- -D warnings
      - name: Check all optional reference tests compile cleanly
        run: cargo clippy --workspace --all-targets --locked --features rdkit-reference -- -D warnings
      - name: Build the Rust helper and test executable
        run: uv run --no-project python scripts/build_inchi_helper.py
      - name: Select the helper for runtime integration tests
        run: uv run --no-project python -c "import os,pathlib; p=pathlib.Path('artifacts/inchi-helper/reshiki-inchi-helper'+('.exe' if os.name=='nt' else '')).resolve(); open(os.environ['GITHUB_ENV'],'a').write('RESHIKI_INCHI_HELPER='+str(p)+'\n')"
      - name: Install fixture reader dependencies
        run: uv sync --locked
      - name: Replay independently captured chemistry fixtures
        run: cargo test --locked --features rdkit-reference --test inchi_reader --test depict_geometry --test depict_rings --test depict_attachment --test depict_seeds --test depict_templates --test depict_collision --test depict_expansion --test depict_finalize --no-fail-fast
      - name: Replay complete aromatic response fixtures
        run: cargo test --locked --features rdkit-reference --test native_aromatic complete_aromatic_responses_match_goldens -- --exact
      # The performance harnesses run in a release test build, which has no
      # debug assertions; only this step compiles the tests that way.
      - name: Build the release test executable for the performance harnesses
        if: runner.os == 'Linux'
        run: cargo test --release --locked --no-default-features --bin reshiki --no-run
      # macOS runners are the scarcest, so the macOS Python checks and the arm64
      # geometry tests run here and not as jobs of their own. Keep the two steps
      # below the same as the python and geometry jobs.
      - name: Check and test Python on macOS
        if: runner.os == 'macOS'
        run: |
          uv run --locked ruff check reference scripts tests
          uv run --locked ruff format --check reference scripts tests
          uv run --locked ty check
          uv run --locked python -m unittest discover -s tests -p 'test_*.py'
          uv run --locked python -m unittest discover -s reference -p 'test_*.py'
          uv run --locked python scripts/check_reference_dependencies.py
      - name: Test the geometry, heap and process crates for the packaged macOS target
        if: runner.os == 'macOS' && needs.scope.outputs.geometry == 'true'
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: |
          cargo test --release --locked -p reshiki-process-heap --no-default-features --target ${{ matrix.target }}
          cargo test --release --locked -p reshiki-process-heap --no-default-features --features allocation-metrics --test global_allocator_unwind --target ${{ matrix.target }}
          cargo test --locked -p reshiki-geometry --features cosmolkit/op-contracts-strict --target ${{ matrix.target }}
          cargo test --locked -p reshiki-model --lib --target ${{ matrix.target }} chemistry::abbreviations::
          cargo check --locked -p reshiki-process --all-targets --target ${{ matrix.target }}
          cargo test --locked -p reshiki-process --target ${{ matrix.target }}
  rust-result:
    name: Rust checks
    needs: [scope, rust-build, rust, rust-extra, rust-lint-goldens]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - *actions_runtime
      - name: Require successful Rust lanes for native changes
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          NATIVE: ${{ needs.scope.outputs.native }}
          RUST_BUILD_RESULT: ${{ needs.rust-build.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          RUST_EXTRA_RESULT: ${{ needs.rust-extra.result }}
          LINT_GOLDENS_RESULT: ${{ needs.rust-lint-goldens.result }}
        run: |
          [[ "$SCOPE_RESULT" == success ]] || exit 1
          for result in "$RUST_BUILD_RESULT" "$RUST_RESULT" "$RUST_EXTRA_RESULT" "$LINT_GOLDENS_RESULT"; do
            case "$result" in
              success) ;;
              skipped) [[ "$NATIVE" != true ]] || exit 1 ;;
              *) exit 1 ;;
            esac
          done
  # The browser build: the editor and the headless library for wasm32, as
  # scripts/build_wasm.sh builds them, and the packages/editor tests. The
  # tests load an unoptimised debug build; only releases build the bundle.
  browser:
    name: Browser build (wasm32)
    needs: scope
    if: needs.scope.outputs.native == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - *actions_runtime
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: rustup toolchain install 1.99.1 --profile minimal --component clippy --target wasm32-unknown-unknown
      - run: rustup default 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: wasm32
      - name: Check the browser editor, its worker and the headless library for wasm32
        run: cargo clippy -p reshiki-web -p reshiki -p reshiki-web-worker --lib --bin reshiki --target wasm32-unknown-unknown --locked -- -D warnings
      - name: Build the headless library for the package tests
        run: |
          version=$(awk '$0 == "name = \"wasm-bindgen\"" { getline; gsub(/"/, "", $3); print $3 }' Cargo.lock)
          cargo install wasm-bindgen-cli --version "$version" --locked
          cargo build -p reshiki-web --lib --target wasm32-unknown-unknown --locked
          wasm-bindgen --target web --out-dir packages/editor/dist/wasm target/wasm32-unknown-unknown/debug/reshiki_web.wasm
      - name: Test the browser package
        working-directory: packages/editor
        run: bun test
  geometry:
    name: Rust geometry (${{ matrix.target }})
    needs: scope
    if: needs.scope.outputs.geometry == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.matrix).geometry }}
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      # Keep the packaged Windows executable independent of redistributable CRT DLLs.
      RUSTFLAGS: ${{ endsWith(matrix.target, '-pc-windows-msvc') && '-C target-feature=+crt-static' || '' }}
    steps:
      - *actions_runtime
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select the matching native Rust host
        run: rustup set default-host ${{ matrix.target }}
      - run: rustup toolchain install 1.99.1 --profile minimal --target ${{ matrix.target }}
      - run: rustup default 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        # One cache, not one per target (2.5 GB of the 10 GB repository limit):
        # Windows x64 gains most from it on pull requests (about 3.5 minutes);
        # the other targets build cold in 4 to 8 minutes, off the critical path.
        if: matrix.target == 'x86_64-pc-windows-msvc'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: geometry
      - name: Select the native Windows compiler
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc
        with:
          arch: ${{ matrix.msvc_arch }}
      - name: Test native heap allocation and panic unwinding
        run: cargo test --release --locked -p reshiki-process-heap --no-default-features --target ${{ matrix.target }}
      - name: Test panic unwinding through the measured application heap
        run: cargo test --release --locked -p reshiki-process-heap --no-default-features --features allocation-metrics --test global_allocator_unwind --target ${{ matrix.target }}
      - name: Test the Rust geometry crate with the locked COSMolKit source
        run: cargo test --locked -p reshiki-geometry --features cosmolkit/op-contracts-strict --target ${{ matrix.target }}
      - name: Compare abbreviation layouts with the frozen RDKit captures
        # The catalog lays groups out with the native depiction port at run
        # time; this replaces the former per-platform capture workflow.
        run: "cargo test --locked -p reshiki-model --lib --target ${{ matrix.target }} chemistry::abbreviations::"
      - name: Check native process portability
        run: cargo check --locked -p reshiki-process --all-targets --target ${{ matrix.target }}
      - name: Test native process limits on the matching host
        run: cargo test --locked -p reshiki-process --target ${{ matrix.target }}
  reference:
    needs: scope
    if: needs.scope.outputs.live == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
        platform:
          - os: macos-15
            target: aarch64-apple-darwin
            python: "3.12.15"
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            msvc_arch: x64
            python: cpython-3.12.15-windows-x86_64-none
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            python: "3.12.15"
    runs-on: ${{ matrix.platform.os }}
    env:
      UV_PYTHON: ${{ matrix.platform.python }}
      RESHIKI_REQUIRE_INCHI_HELPER: "1"
      # Shard 0 runs the workspace library and app tests, whose local naming
      # worker tests need this exact source's built executable.
      RESHIKI_NAMING_HELPER: ${{ github.workspace }}/target/debug/reshiki${{ endsWith(matrix.platform.target, '-pc-windows-msvc') && '.exe' || '' }}
    steps:
      - *actions_runtime
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libfontconfig1-dev libudev-dev
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: rustup default 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # All shards compile the same dependencies, and rust-cache drops the
          # workspace's own artifacts before saving, so one cache per platform
          # serves every shard. Twelve per-shard caches (about 16 GB) overflowed
          # the 10 GB repository cache: no shard ever restored one, and saving
          # them evicted the `rust` caches every pull request restores.
          # macOS and Windows read the `rust` cache, which the rust job warms
          # with the reference feature on every main push. The Linux rust job
          # runs in a container with a different cache key, so Linux keeps a
          # reference cache that shard 0, the superset build, saves.
          save-if: ${{ github.ref == 'refs/heads/main' && runner.os == 'Linux' && matrix.shard == 0 }}
          shared-key: ${{ runner.os == 'Linux' && 'reference' || 'rust' }}
          cache-on-failure: true
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: ${{ matrix.platform.python }}
      - name: Select the native Windows compiler
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc
        with:
          arch: ${{ matrix.platform.msvc_arch }}
      - name: Build the Rust helper and test executable
        run: uv run --no-project python scripts/build_inchi_helper.py
      - name: Select the helper for runtime integration tests
        run: uv run --no-project python -c "import os,pathlib; p=pathlib.Path('artifacts/inchi-helper/reshiki-inchi-helper'+('.exe' if os.name=='nt' else '')).resolve(); open(os.environ['GITHUB_ENV'],'a').write('RESHIKI_INCHI_HELPER='+str(p)+'\n')"
      - name: Install the optional reference dependencies
        run: uv sync --locked
      - name: Build live Linux depiction observers for the installed reference wheel
        if: runner.os == 'Linux'
        run: uv run --locked python scripts/setup_linux_depict_reference.py
      - name: Select x64 MSVC for the original Windows reference wheel
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc
        with:
          arch: x64
      - name: Build live Windows depiction observers for the installed reference wheel
        if: runner.os == 'Windows'
        run: uv run --locked python scripts/setup_windows_depict_reference.py
      - name: Restore the native Windows compiler for Rust tests
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc
        with:
          arch: ${{ matrix.platform.msvc_arch }}
      - name: Build the exact application for local naming worker tests
        if: matrix.shard == 0
        run: cargo build --locked --features rdkit-reference --bin reshiki
      - name: Run every assigned reference target
        run: uv run --locked python scripts/run_reference_shard.py --index ${{ matrix.shard }} --count 4
      - name: Preserve shard results and failed comparisons
        if: ${{ always() && steps.actions_runtime_guard.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reference-${{ matrix.platform.target }}-${{ matrix.shard }}
          path: |
            artifacts/reference-shard-*.json
            artifacts/*-actual.json
            artifacts/*-expected.json
            artifacts/*-engine-failures.txt
            artifacts/native-import-*-failures.log
            artifacts/depict-live-windows/*.json*
            artifacts/depict-live-windows/*.log
            artifacts/depict-windows-*/compiler.log
          if-no-files-found: ignore
          retention-days: 7
  capture-aromatic:
    if: github.event_name == 'workflow_dispatch' && inputs.capture_aromatic
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            fixture: macos
            python: "3.12.15"
          - os: windows-2022
            fixture: windows
            python: cpython-3.12.15-windows-x86_64-none
          - os: ubuntu-22.04
            fixture: linux
            python: "3.12.15"
    runs-on: ${{ matrix.os }}
    steps:
      - *actions_runtime
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: Restore the historical template inputs used by the captured requests
        run: uv run --locked python -c "import gzip,pathlib; pathlib.Path('assets/templates.json').write_bytes(gzip.decompress(pathlib.Path('tests/fixtures/aromatic-template-inputs.json.gz').read_bytes()))"
      - name: Capture original worker responses on this platform
        run: uv run --locked python reference/native_aromatic_reference.py --requests tests/fixtures/native-aromatic-${{ matrix.fixture }}.json.gz --output artifacts/native-aromatic-${{ matrix.fixture }}.json.gz
      - name: Require every recorded request and response to remain unchanged
        run: uv run --locked python -c "import gzip,json; old=json.loads(gzip.open('tests/fixtures/native-aromatic-${{ matrix.fixture }}.json.gz','rt').readline()); new=json.loads(gzip.open('artifacts/native-aromatic-${{ matrix.fixture }}.json.gz','rt').readline()); assert old['records_sha256']==new['records_sha256'], 'Responses changed; review the differences before accepting new fixtures'"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aromatic-capture-${{ matrix.fixture }}
          path: artifacts/native-aromatic-${{ matrix.fixture }}.json.gz
          if-no-files-found: error
