name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live_reference:
        description: Run every live RDKit comparison on all three test platforms
        type: boolean
        default: false
      capture_aromatic:
        description: Recapture unchanged aromatic responses and their source provenance
        type: boolean
        default: false
  workflow_call:
    inputs:
      live_reference:
        type: boolean
        default: true
  schedule:
    - cron: "19 3 * * 1"
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scope:
    runs-on: ubuntu-22.04
    outputs:
      native: ${{ steps.scope.outputs.native }}
      live: ${{ steps.scope.outputs.live }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: scope
        env:
          CI_LIVE_REFERENCE: ${{ inputs.live_reference || false }}
        run: python3 scripts/ci_scope.py
  web:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint:js
      - run: bun run format:check
  python:
    needs: scope
    if: needs.scope.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            python: "3.12"
          - os: windows-2022
            python: cpython-3.12-windows-x86_64-none
          - os: ubuntu-22.04
            python: "3.12"
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.3"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --locked ruff check engine scripts tests
      - run: uv run --locked ruff format --check engine scripts tests
      - run: uv run --locked ty check
      - name: Install Rust for native macOS clipboard and printing checks
        if: runner.os == 'macOS'
        run: rustup toolchain install 1.99.0 --profile minimal && rustup default 1.99.0
      - run: uv run --locked python -m unittest discover -s tests -p 'test_*.py'
      - run: uv run --locked python scripts/check_reference_dependencies.py
  libreoffice-uno:
    name: LibreOffice UNO regressions
    needs: scope
    if: needs.scope.outputs.native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install matching LibreOffice and Python UNO packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -t noble-backports \
            libreoffice-core-nogui python3-uno
      - name: Record and require a supported LibreOffice runtime
        run: |
          dpkg-query -W libreoffice-core-nogui python3-uno python3
          reshiki_lo_version="$(dpkg-query -W -f='${Version}' libreoffice-core-nogui)"
          dpkg --compare-versions "${reshiki_lo_version#*:}" ge 25.8
      - name: Run all LibreOffice UNO regression tests
        run: /usr/bin/python3 -m unittest discover -s integrations/libreoffice/tests -p 'test_*.py' -v
  linux-x11:
    name: Linux X11 clipboard regressions
    needs: scope
    if: needs.scope.outputs.native == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the isolated X11 test server and clipboard libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xauth libwayland-dev libxkbcommon-dev pkg-config
      - run: rustup toolchain install 1.99.0 --profile minimal && rustup default 1.99.0
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          shared-key: linux-x11
      - name: Run native clipboard regressions serially on a private display
        run: |
          xvfb-run -a -s '-screen 0 1024x768x24 -nolisten tcp' cargo test -p reshiki-linux --lib --locked --no-default-features x11::tests:: -- --ignored --test-threads=1
  rust:
    needs: scope
    if: needs.scope.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            python: "3.12"
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            msvc_arch: x64
            python: cpython-3.12-windows-x86_64-none
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            python: "3.12"
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
      RESHIKI_REQUIRE_INCHI_HELPER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libfontconfig1-dev libudev-dev
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - run: rustup default 1.99.0
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.3"
          python-version: ${{ matrix.python }}
      - name: Select the native Windows compiler
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc
        with:
          arch: ${{ matrix.msvc_arch }}
      - name: Build the Rust helper and test executable
        run: uv run --no-project python scripts/build_inchi_helper.py --target ${{ matrix.target }}
      - name: Select the helper for runtime integration tests
        run: uv run --no-project python -c "import os,pathlib; p=pathlib.Path('artifacts/inchi-helper/reshiki-inchi-helper'+('.exe' if os.name=='nt' else '')).resolve(); open(os.environ['GITHUB_ENV'],'a').write('RESHIKI_INCHI_HELPER='+str(p)+'\n')"
      - name: Check Rust heap and byte protocol boundaries
        run: uv run --no-project python -m unittest tests.test_inchi_helper_protocol tests.test_inchi_helper_builder tests.test_inchi_distribution
      - run: cargo fmt --all --check
      - name: Check the native application without reference dependencies
        run: cargo clippy --workspace --all-targets --locked --no-default-features -- -D warnings
      - run: cargo check --workspace --all-targets --locked --no-default-features
      - name: Test rendered numeric-field focus on Windows
        if: runner.os == 'Windows'
        # The Windows renderer includes Tiny Skia when WGPU is unavailable.
        # This checks widget layout/input; it is not native desktop acceptance.
        run: cargo test --locked --no-default-features --bin reshiki app::numeric_transforms::focus::tests::handle_shortcut_focuses_selects_and_reveals_the_field_in_both_window_sizes -- --exact --ignored
      - name: Test rendered cascading menus on Windows
        if: runner.os == 'Windows'
        # The headless renderer falls back to TinySkia on Windows. These
        # exercise widget input and layout, not native OS acceptance.
        run: "cargo test --locked --no-default-features --bin reshiki app::context_menu::cascade_tests:: -- --ignored"
      - name: Test rendered Updates modal keyboard input on Windows
        if: runner.os == 'Windows'
        # The Windows renderer includes Tiny Skia when WGPU is unavailable.
        # This checks widget layout/input; it is not native desktop acceptance.
        run: cargo test --locked --no-default-features --bin reshiki app::shortcut_focus_tests::updates_ -- --ignored
      - name: Test rendered tool flyout input ownership on Windows
        if: runner.os == 'Windows'
        # Exercise the actual application widgets, including the Tiny Skia fallback.
        # Native desktop timing and accessibility acceptance remain separate.
        run: cargo test --locked --no-default-features --bin reshiki app::shortcut_focus_tests::tool_palette_pointer_gestures_and_keyboard_activation_have_one_owner -- --exact --ignored
      - run: cargo test --workspace --locked --no-default-features
      - name: Verify public SciFinder handoff fixtures
        run: cargo run --locked --no-default-features --example scifinder_handoff_qa -- "${{ runner.temp }}/reshiki-scifinder-handoff"
      - name: Install fixture reader dependencies
        run: uv sync --locked
      - name: Check all optional reference tests compile cleanly
        run: cargo clippy --workspace --all-targets --locked --features rdkit-reference -- -D warnings
      - name: Select the captured Ubuntu fixture profile
        if: runner.os == 'Linux'
        run: echo "RESHIKI_TEST_LINUX_GOLDENS=ubuntu-22.04-x64" >> "$GITHUB_ENV"
      - name: Replay independently captured chemistry fixtures
        run: cargo test --locked --features rdkit-reference --test inchi_input --test inchi_output --test inchi_reader --test inchi_rust --test depict_geometry --test depict_rings --test depict_attachment --test depict_seeds --test depict_templates --test depict_collision --test depict_expansion --test depict_finalize --no-fail-fast
      - name: Replay complete aromatic response fixtures
        run: cargo test --locked --features rdkit-reference --test native_aromatic complete_aromatic_responses_match_goldens -- --exact
  reference:
    needs: scope
    if: needs.scope.outputs.live == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
        platform:
          - os: macos-14
            target: aarch64-apple-darwin
            python: "3.12"
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            msvc_arch: x64
            python: cpython-3.12-windows-x86_64-none
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            python: "3.12"
    runs-on: ${{ matrix.platform.os }}
    env:
      UV_PYTHON: ${{ matrix.platform.python }}
      RESHIKI_REQUIRE_INCHI_HELPER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libfontconfig1-dev libudev-dev
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - run: rustup default 1.99.0
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          shared-key: reference-${{ matrix.shard }}
          cache-on-failure: true
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.3"
          python-version: ${{ matrix.platform.python }}
      - name: Select the native Windows compiler
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc
        with:
          arch: ${{ matrix.platform.msvc_arch }}
      - name: Build the Rust helper and test executable
        run: uv run --no-project python scripts/build_inchi_helper.py --target ${{ matrix.platform.target }}
      - name: Select the helper for runtime integration tests
        run: uv run --no-project python -c "import os,pathlib; p=pathlib.Path('artifacts/inchi-helper/reshiki-inchi-helper'+('.exe' if os.name=='nt' else '')).resolve(); open(os.environ['GITHUB_ENV'],'a').write('RESHIKI_INCHI_HELPER='+str(p)+'\n')"
      - name: Install the optional reference dependencies
        run: uv sync --locked
      - name: Build live Linux depiction observers for the installed reference wheel
        if: runner.os == 'Linux'
        run: uv run --locked python scripts/setup_linux_depict_reference.py
      - name: Select x64 MSVC for the original Windows reference wheel
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc
        with:
          arch: x64
      - name: Build live Windows depiction observers for the installed reference wheel
        if: runner.os == 'Windows'
        run: uv run --locked python scripts/setup_windows_depict_reference.py
      - name: Restore the native Windows compiler for Rust tests
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc
        with:
          arch: ${{ matrix.platform.msvc_arch }}
      - name: Run every assigned reference target
        run: uv run --locked python scripts/run_reference_shard.py --index ${{ matrix.shard }} --count 4
      - name: Preserve shard results and failed comparisons
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reference-${{ matrix.platform.target }}-${{ matrix.shard }}
          path: |
            artifacts/reference-shard-*.json
            artifacts/*-actual.json
            artifacts/*-expected.json
            artifacts/*-engine-failures.txt
            artifacts/native-import-*-failures.log
            artifacts/depict-live-windows/*.json*
            artifacts/depict-live-windows/*.log
            artifacts/depict-windows-*/compiler.log
          if-no-files-found: ignore
          retention-days: 7
  capture-aromatic:
    if: github.event_name == 'workflow_dispatch' && inputs.capture_aromatic
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            fixture: macos
            python: "3.12"
          - os: windows-2022
            fixture: windows
            python: cpython-3.12-windows-x86_64-none
          - os: ubuntu-22.04
            fixture: linux
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.3"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: Restore the historical template inputs used by the captured requests
        run: uv run --locked python -c "import gzip,pathlib; pathlib.Path('assets/templates.json').write_bytes(gzip.decompress(pathlib.Path('tests/fixtures/aromatic-template-inputs.json.gz').read_bytes()))"
      - name: Capture original worker responses on this platform
        run: uv run --locked python tests/native_aromatic_reference.py --requests tests/fixtures/native-aromatic-${{ matrix.fixture }}.json.gz --output artifacts/native-aromatic-${{ matrix.fixture }}.json.gz
      - name: Require every recorded request and response to remain unchanged
        run: uv run --locked python -c "import gzip,json; old=json.loads(gzip.open('tests/fixtures/native-aromatic-${{ matrix.fixture }}.json.gz','rt').readline()); new=json.loads(gzip.open('artifacts/native-aromatic-${{ matrix.fixture }}.json.gz','rt').readline()); assert old['records_sha256']==new['records_sha256'], 'Responses changed; review the differences before accepting new fixtures'"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aromatic-capture-${{ matrix.fixture }}
          path: artifacts/native-aromatic-${{ matrix.fixture }}.json.gz
          if-no-files-found: error
