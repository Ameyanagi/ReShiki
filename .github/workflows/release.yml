name: Release builds
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      nightly:
        description: Test nightly versions and installers without publishing
        type: boolean
        default: false
      sign_macos:
        description: Sign and notarize macOS test packages (requires signing secrets)
        type: boolean
        default: false
      sign_windows:
        description: Sign Windows test packages through SignPath
        type: boolean
        default: false
      windows_signing_policy:
        description: SignPath policy for manually requested Windows signing
        type: choice
        options: [test-signing, release-signing]
        default: test-signing
      npm_only:
        description: Only publish @ameyanagi/reshiki at main's version to npm (no builds, release or demo)
        type: boolean
        default: false
  workflow_call:
    inputs:
      nightly:
        description: Build nightly packages with installers and a unique version
        type: boolean
        default: false
      sign_windows:
        description: Sign qualified Windows packages through SignPath
        type: boolean
        default: false
      windows_signing_policy:
        description: SignPath policy; test signing creates internal CI artifacts only
        type: string
        default: release-signing
    outputs:
      nightly_version:
        value: ${{ jobs.validate.outputs.nightly_version }}
      windows_signing_enabled:
        value: ${{ jobs.validate.outputs.windows_signing_enabled }}
      windows_signing_policy:
        value: ${{ jobs.validate.outputs.windows_signing_policy }}
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'tag' }}
  cancel-in-progress: false
env:
  UV_PYTHON_PREFERENCE: only-managed
jobs:
  reference:
    needs: validate
    if: github.event_name == 'push'
    uses: ./.github/workflows/checks.yml
    with:
      live_reference: true
  validate:
    # Every build, signing and release job needs validate, so npm_only skips them all.
    if: ${{ !inputs.npm_only }}
    runs-on: ubuntu-22.04
    outputs:
      nightly_version: ${{ steps.nightly.outputs.version }}
      windows_signing_enabled: ${{ steps.windows-signing.outputs.enabled }}
      windows_signing_policy: ${{ steps.windows-signing.outputs.policy }}
    steps:
      - &actions_runtime
        name: Require a patched GitHub Actions Node runtime
        id: actions_runtime_guard
        shell: pwsh
        run: |
          # This exact body is embedded before checkout in every workflow that uses
          # JavaScript actions. tests/test_ci_runtime_policy.py checks that it stays exact.
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          function Get-ActionsNodePath {
              param([string[]] $WorkerPaths)
              if (@($WorkerPaths).Count -ne 1 -or [string]::IsNullOrWhiteSpace($WorkerPaths[0])) {
                  throw 'Expected exactly one live Runner.Worker executable; refusing to use Node from PATH.'
              }
              $worker = $WorkerPaths[0]
              $workerName = if ($IsWindows) { 'Runner.Worker.exe' } else { 'Runner.Worker' }
              if (-not [IO.Path]::IsPathRooted($worker) -or (Split-Path $worker -Leaf) -cne $workerName) {
                  throw "Unexpected Runner.Worker executable: $worker"
              }
              $bin = Split-Path $worker -Parent
              if ((Split-Path $bin -Leaf) -cne 'bin') {
                  throw "Runner.Worker is not in its runner's bin directory: $worker"
              }
              $root = Split-Path $bin -Parent
              $name = if ($IsWindows) { 'node.exe' } else { 'node' }
              $node = [IO.Path]::GetFullPath((Join-Path $root "externals/node24/bin/$name"))
              if (-not (Test-Path -LiteralPath $node -PathType Leaf)) {
                  throw "The active runner has no embedded Node 24: $node"
              }
              return $node
          }

          function Assert-ActionsNodeRuntime {
              param([object] $Runtime, [string] $NodePath)
              if ($Runtime.versions.node -cnotmatch '^24\.[0-9]+\.[0-9]+$' -or
                  [version] $Runtime.versions.node -lt [version] '24.22.1') {
                  throw "JavaScript actions require the runner's Node >=24.22.1 (24.x); found $($Runtime.versions.node). Update the runner; setup-node cannot fix this runtime."
              }
              if ($Runtime.versions.brotli -cnotmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
                  throw 'The embedded Node runtime did not report its Brotli version.'
              }
              $comparison = if ($IsWindows) { [StringComparison]::OrdinalIgnoreCase } else { [StringComparison]::Ordinal }
              if (-not [string]::Equals([IO.Path]::GetFullPath($Runtime.execPath), $NodePath, $comparison)) {
                  throw "The inspected runtime is not the active runner's embedded Node: $($Runtime.execPath)"
              }
              # Official Node 24.22.1 backports CVE-2026-111497 while retaining the
              # Brotli 1.2.0 version label. The Node security-release floor is authoritative:
              # https://github.com/nodejs/node/compare/v24.21.0...v24.22.1
              Write-Host "Verified Actions runtime: Node $($Runtime.versions.node), Brotli $($Runtime.versions.brotli), $NodePath"
          }

          $workers = @(Get-Process -Name Runner.Worker -ErrorAction Stop | ForEach-Object { $_.Path })
          $node = Get-ActionsNodePath -WorkerPaths $workers
          $reported = & $node -p 'JSON.stringify({execPath:process.execPath,versions:process.versions})'
          if ($LASTEXITCODE -ne 0) { throw 'The active runner could not report its embedded Node version.' }
          Assert-ActionsNodeRuntime -Runtime ($reported | ConvertFrom-Json) -NodePath $node
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.12.15"
          enable-cache: false
      - name: Select the Windows signing mode
        id: windows-signing
        env:
          SIGN_WINDOWS: ${{ (github.event_name == 'push' && vars.SIGNPATH_ENABLED == 'true') || (github.event_name != 'push' && inputs.sign_windows) }}
          # Stable tags always use the release policy. Manual and reusable
          # callers may request test signatures for internal CI artifacts.
          SIGNING_POLICY: ${{ github.event_name == 'push' && 'release-signing' || inputs.windows_signing_policy }}
        run: |
          case "$SIGNING_POLICY" in
            test-signing|release-signing) ;;
            *) echo 'Unknown Windows signing policy' >&2; exit 1 ;;
          esac
          echo "enabled=$SIGN_WINDOWS" >> "$GITHUB_OUTPUT"
          echo "policy=$SIGNING_POLICY" >> "$GITHUB_OUTPUT"
      - name: Prepare nightly version
        if: inputs.nightly
        id: nightly
        run: |
          uv run --no-project --python 3.12.15 python -m unittest tests.test_prepare_nightly
          version=$(uv run --no-project --python 3.12.15 python scripts/prepare_nightly.py --identifier "$(date -u +%Y%m%d).${{ github.run_id }}.${{ github.run_attempt }}")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Require production signing and stable release tags to belong to main
        if: github.event_name == 'push' || (steps.windows-signing.outputs.enabled == 'true' && steps.windows-signing.outputs.policy == 'release-signing')
        run: |
          case "$GITHUB_REF" in
            refs/heads/main|refs/tags/v*) ;;
            *) echo 'Production Windows signing requires main or a v* tag belonging to main' >&2; exit 1 ;;
          esac
          git fetch --no-tags --unshallow origin main
          git merge-base --is-ancestor HEAD FETCH_HEAD
      - name: Require tag and package versions to match
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --no-project --python 3.12.15 python scripts/build_release.py --tag "$RELEASE_TAG" --check-tag-only
  build:
    needs: validate
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: macos-arm64
            target: aarch64-apple-darwin
            python: "3.12.15"
          - os: macos-15-intel
            artifact: macos-x64
            target: x86_64-apple-darwin
            python: "3.12.15"
            # The pinned RDKit reference has no Intel macOS wheel. Runtime is native.
            native_only: true
          - os: windows-2022
            artifact: windows-x64
            target: x86_64-pc-windows-msvc
            msvc_arch: x64
            python: cpython-3.12.15-windows-x86_64-none
          - os: windows-11-arm
            artifact: windows-arm64
            target: aarch64-pc-windows-msvc
            msvc_arch: arm64
            # RDKit reference tests use the x64 wheel through Windows 11 emulation.
            python: cpython-3.12.15-windows-x86_64-none
          - os: ubuntu-22.04
            artifact: linux-x64
            target: x86_64-unknown-linux-gnu
            python: "3.12.15"
          - os: ubuntu-24.04-arm
            artifact: linux-arm64
            target: aarch64-unknown-linux-gnu
            python: "3.12.15"
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
      # Keep the Rust application independent of redistributable Windows CRT DLLs.
      RUSTFLAGS: ${{ endsWith(matrix.target, '-pc-windows-msvc') && '-C target-feature=+crt-static' || '' }}
    steps:
      - *actions_runtime
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: ${{ matrix.python }}
      - name: Stamp nightly package version
        if: inputs.nightly
        shell: bash
        env:
          NIGHTLY_VERSION: ${{ needs.validate.outputs.nightly_version }}
        run: uv run --no-project --python 3.12.15 python scripts/prepare_nightly.py --version "$NIGHTLY_VERSION"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Previous release caches included packaged license sources in target/.
          prefix-key: v1-release-staging
          cache-on-failure: true
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y binutils libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libfontconfig1-dev libudev-dev
      - run: rustup toolchain install 1.99.0 --profile minimal --target ${{ matrix.target }}
      - run: rustup default 1.99.0
      - name: Select the native Windows compiler
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc
        with:
          arch: ${{ matrix.msvc_arch }}
      - run: uv sync --locked
        if: matrix.native_only != true
      - name: Install pinned Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compilerInstaller = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $compilerInstaller
          if ((Get-FileHash $compilerInstaller -Algorithm SHA256).Hash.ToLowerInvariant() -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') { throw 'Inno Setup checksum mismatch' }
          $compilerDir = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          $installerProcess = Start-Process $compilerInstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$compilerDir`"") -Wait -PassThru
          if ($installerProcess.ExitCode -ne 0) { throw 'Inno Setup installation failed' }
          "RESHIKI_ISCC=$compilerDir\ISCC.exe" >> $env:GITHUB_ENV
      - name: Test chemistry and packaging on this platform
        if: matrix.native_only != true
        run: uv run --locked python -m unittest discover -s tests -p 'test_*.py'
      - name: Test the RDKit reference worker and oracles on this platform
        if: matrix.native_only != true
        run: uv run --locked python -m unittest discover -s reference -p 'test_*.py'
      - name: Build Intel native helper boundary fixtures
        if: matrix.native_only == true
        run: uv run --no-project --isolated --python 3.12.15 python scripts/build_inchi_helper.py --target ${{ matrix.target }}
      - name: Test Intel Mac packaging without reference dependencies
        if: matrix.native_only == true
        env:
          RESHIKI_REQUIRE_INCHI_HELPER: "1"
        run: uv run --no-project --with certifi==2026.10.23 --isolated --python 3.12.15 python -m unittest tests.test_release tests.test_release_downloads tests.test_prepare_nightly tests.test_inchi_distribution tests.test_inchi_helper_builder tests.test_inchi_helper_protocol tests.test_native_packaging tests.test_agent_api_package tests.test_geometry_distribution tests.test_license_notices tests.test_native_clipboard tests.test_native_print
      - name: Verify reference dependencies
        if: matrix.native_only != true
        run: uv run --locked python scripts/check_reference_dependencies.py
      - name: Build and test extracted portable archive
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: uv run --no-project --isolated --python 3.12.15 python scripts/build_release.py --target ${{ matrix.target }} --installer
      - name: Check the application worker protocols and heap boundaries
        env:
          RESHIKI_REQUIRE_INCHI_HELPER: "1"
          RESHIKI_REQUIRE_GEOMETRY_APP: "1"
          RESHIKI_TEST_PACKAGED_APP: ${{ github.workspace }}/target/${{ matrix.target }}/release/reshiki${{ runner.os == 'Windows' && '.exe' || '' }}
        run: uv run --no-project --with certifi==2026.10.23 --isolated --python 3.12.15 python -m unittest tests.test_inchi_helper_protocol tests.test_inchi_distribution.HelperTests.test_packaged_application_worker_executes_when_supplied_for_validation tests.test_geometry_distribution.GeometryWorkerTests.test_packaged_application_worker_executes_when_supplied_for_validation
      # The default shell, as for every other Windows cargo step: under bash,
      # Git's /usr/bin/link shadows the MSVC linker.
      - name: Test the Windows process helpers
        if: runner.os == 'Windows'
        env:
          RESHIKI_REQUIRE_INCHI_HELPER: "1"
        run: cargo test --release --locked --no-default-features -p reshiki-windows --target ${{ matrix.target }}
      - name: Check that worker processes do not inherit the MCP client's pipes
        if: runner.os == 'Windows'
        env:
          RESHIKI_REQUIRE_INCHI_HELPER: "1"
        run: cargo test --release --locked --no-default-features -p reshiki --test agent_api_windows_pipes --target ${{ matrix.target }}
      - name: Compare geometry energies and gradients with the pinned independent oracle
        if: matrix.native_only != true
        env:
          RESHIKI_GEOMETRY_REFERENCE_APP: ${{ github.workspace }}/target/${{ matrix.target }}/release/reshiki${{ runner.os == 'Windows' && '.exe' || '' }}
          RESHIKI_REQUIRE_GEOMETRY_REFERENCE: "1"
        run: uv run --locked python -m unittest tests.test_geometry_reference
      - name: Test native macOS clipboard and physical print coordinates
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: cargo test --release --locked -p reshiki-macos --target ${{ matrix.target }}
      - name: Test native chemistry on Intel macOS
        if: matrix.artifact == 'macos-x64'
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
          RESHIKI_REQUIRE_INCHI_HELPER: "1"
          RESHIKI_INCHI_HELPER: ${{ github.workspace }}/target/x86_64-apple-darwin/release/reshiki
          RESHIKI_NAMING_HELPER: ${{ github.workspace }}/target/x86_64-apple-darwin/release/reshiki
        run: cargo test --release --locked --no-default-features --lib --target x86_64-apple-darwin
      - name: Test the nightly application and renderer regressions
        if: inputs.nightly
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
          RESHIKI_REQUIRE_INCHI_HELPER: "1"
          RESHIKI_INCHI_HELPER: ${{ github.workspace }}/target/${{ matrix.target }}/release/reshiki${{ runner.os == 'Windows' && '.exe' || '' }}
          RESHIKI_NAMING_HELPER: ${{ github.workspace }}/target/${{ matrix.target }}/release/reshiki${{ runner.os == 'Windows' && '.exe' || '' }}
        run: cargo test --release --locked --no-default-features --bin reshiki --target ${{ matrix.target }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-${{ matrix.artifact }}
          path: dist/releases/*
          if-no-files-found: error
  sign:
    needs: [validate, build]
    if: ${{ github.event_name == 'push' || inputs.sign_macos || (inputs.nightly && github.ref == 'refs/heads/main') }}
    environment: macos-signing
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: macos-arm64
          - os: macos-15-intel
            artifact: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - *actions_runtime
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.12.15"
      - name: Match the nightly version of the qualified archive
        if: inputs.nightly
        env:
          NIGHTLY_VERSION: ${{ needs.validate.outputs.nightly_version }}
        run: uv run --no-project --python 3.12.15 python scripts/prepare_nightly.py --version "$NIGHTLY_VERSION"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-${{ matrix.artifact }}
          path: unsigned
      - name: Sign, notarize, staple, and verify the existing build
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
        run: uv run --no-project --isolated --python 3.12.15 python scripts/sign_release.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-${{ matrix.artifact }}
          path: dist/releases/*
          if-no-files-found: error
  sign_windows:
    needs: [validate, build]
    if: needs.validate.outputs.windows_signing_enabled == 'true'
    environment: windows-signing
    # Two sequential signing requests may each require manual approval.
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            architecture: x64
          - os: windows-11-arm
            architecture: arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    env:
      WINDOWS_SIGNING_POLICY: ${{ needs.validate.outputs.windows_signing_policy }}
    steps:
      - *actions_runtime
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: cpython-3.12.15-windows-x86_64-none
          enable-cache: false
      - name: Select the native Windows tools for package verification
        uses: ./.github/actions/setup-msvc
        with:
          arch: ${{ matrix.architecture }}
      - name: Match the nightly version of the qualified archive
        if: inputs.nightly
        env:
          NIGHTLY_VERSION: ${{ needs.validate.outputs.nightly_version }}
        run: uv run --no-project --python 3.12.15 python scripts/prepare_nightly.py --version "$env:NIGHTLY_VERSION"
      - name: Select and require the signing certificate pin
        env:
          SIGNPATH_RELEASE_CERTIFICATE_SHA256: ${{ vars.SIGNPATH_RELEASE_CERTIFICATE_SHA256 }}
          SIGNPATH_TEST_CERTIFICATE_SHA256: ${{ vars.SIGNPATH_TEST_CERTIFICATE_SHA256 }}
        run: |
          if ($env:WINDOWS_SIGNING_POLICY -eq 'release-signing') {
            $certificate = $env:SIGNPATH_RELEASE_CERTIFICATE_SHA256
          } elseif ($env:WINDOWS_SIGNING_POLICY -eq 'test-signing') {
            $certificate = $env:SIGNPATH_TEST_CERTIFICATE_SHA256
          } else {
            throw 'Unknown Windows signing policy'
          }
          if ($certificate -notmatch '^[0-9a-fA-F]{64}$') { throw 'Configure the SHA-256 certificate pin for the selected signing policy' }
          "CERTIFICATE_SHA256=$certificate" >> $env:GITHUB_ENV
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-windows-${{ matrix.architecture }}
          path: unsigned
      - name: Verify and stage the qualified application
        id: prepare
        run: uv run --no-project --isolated --python 3.12.15 python scripts/sign_windows_release.py prepare --architecture ${{ matrix.architecture }} --policy "$env:WINDOWS_SIGNING_POLICY" --certificate-sha256 "$env:CERTIFICATE_SHA256"
      # upload-artifact wraps only reshiki.exe in the ZIP expected by windows-app.
      - name: Upload the application signing input
        id: app-input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signing-input-windows-app-${{ matrix.architecture }}-attempt-${{ github.run_attempt }}
          path: signing-input/app/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Sign the application with SignPath
        uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'ReShiki' }}
          signing-policy-slug: ${{ needs.validate.outputs.windows_signing_policy }}
          artifact-configuration-slug: windows-app
          github-artifact-id: ${{ steps.app-input.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(steps.prepare.outputs.version) }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-app
      - name: Install pinned Windows installer compiler
        run: |
          $compilerInstaller = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $compilerInstaller
          if ((Get-FileHash $compilerInstaller -Algorithm SHA256).Hash.ToLowerInvariant() -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') { throw 'Inno Setup checksum mismatch' }
          $compilerDir = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          $installerProcess = Start-Process $compilerInstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$compilerDir`"") -Wait -PassThru
          if ($installerProcess.ExitCode -ne 0) { throw 'Inno Setup installation failed' }
          "RESHIKI_ISCC=$compilerDir\ISCC.exe" >> $env:GITHUB_ENV
      - name: Verify the signed application and package it into the installer
        run: uv run --no-project --isolated --python 3.12.15 python scripts/sign_windows_release.py package --architecture ${{ matrix.architecture }} --policy "$env:WINDOWS_SIGNING_POLICY" --certificate-sha256 "$env:CERTIFICATE_SHA256"
      - name: Upload the installer signing input
        id: installer-input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signing-input-windows-installer-${{ matrix.architecture }}-attempt-${{ github.run_attempt }}
          path: signing-input/installer/reshiki-${{ steps.prepare.outputs.version }}-windows-${{ matrix.architecture }}-setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Sign the installer with SignPath
        uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'ReShiki' }}
          signing-policy-slug: ${{ needs.validate.outputs.windows_signing_policy }}
          artifact-configuration-slug: windows-installer
          github-artifact-id: ${{ steps.installer-input.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(steps.prepare.outputs.version) }}
            architecture: ${{ toJSON(matrix.architecture) }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-installer
      - name: Verify both signatures, smoke test the installer, and checksum final packages
        run: uv run --no-project --isolated --python 3.12.15 python scripts/sign_windows_release.py verify --architecture ${{ matrix.architecture }} --policy "$env:WINDOWS_SIGNING_POLICY" --certificate-sha256 "$env:CERTIFICATE_SHA256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Test certificates are never eligible for a release download.
          name: ${{ needs.validate.outputs.windows_signing_policy == 'test-signing' && 'test-signed' || 'signed' }}-windows-${{ matrix.architecture }}
          path: dist/releases/*
          if-no-files-found: error
  publish:
    needs: [validate, build, sign, sign_windows, reference]
    if: >-
      ${{ always() && github.event_name == 'push'
          && needs.validate.result == 'success'
          && needs.build.result == 'success'
          && needs.sign.result == 'success'
          && needs.reference.result == 'success'
          && ((needs.validate.outputs.windows_signing_enabled == 'true' && needs.sign_windows.result == 'success')
              || (needs.validate.outputs.windows_signing_enabled == 'false' && needs.sign_windows.result == 'skipped')) }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - *actions_runtime
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.12.15"
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: signed-macos-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.validate.outputs.windows_signing_enabled == 'true'
        with:
          pattern: signed-windows-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.validate.outputs.windows_signing_enabled != 'true'
        with:
          name: unsigned-windows-x64
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-linux-x64
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.validate.outputs.windows_signing_enabled != 'true'
        with:
          name: unsigned-windows-arm64
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-linux-arm64
          path: release
      - name: Check every archive and publish
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          WINDOWS_SIGNING: ${{ needs.validate.outputs.windows_signing_enabled == 'true' && 'required' || 'unsigned' }}
        run: |
          set -euo pipefail
          uv run --no-project --python 3.12.15 python ../scripts/release_downloads.py --directory . --repository "$GH_REPO" --tag "$RELEASE_TAG" --notes notes.md --windows-signing "$WINDOWS_SIGNING"
          highlights="../.github/release-notes/$RELEASE_TAG.md"
          if [[ -f "$highlights" ]]; then
            cat "$highlights" notes.md > release-notes.md
            mv release-notes.md notes.md
          fi
          args=(--latest)
          if [[ "$RELEASE_TAG" == *-* ]]; then args=(--prerelease --latest=false); fi
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes --notes-file notes.md "${args[@]}" *.zip *.tar.gz *.dmg *-setup.exe SHA256SUMS
  # The browser editor demo on reshiki.com/demo/ follows the latest release.
  # docs.yml copies the web-demo asset into the site on every deploy.
  web_demo:
    needs: publish
    # always(): publish itself runs after skipped jobs, which would skip this one.
    if: ${{ always() && github.event_name == 'push' && needs.publish.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    # One release at a time writes the web-demo asset.
    concurrency:
      group: web-demo
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - *actions_runtime
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.12.15"
          enable-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: rustup toolchain install 1.99.0 --profile minimal --target wasm32-unknown-unknown
      - run: rustup default 1.99.0
      # build_wasm.sh pins wasm-bindgen to Cargo.lock and binaryen to a checked release.
      - run: scripts/build_wasm.sh --test
      # The npm job publishes this same tested build.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package-dist
          path: packages/editor/dist
          if-no-files-found: error
          retention-days: 7
      # Keep the published demo's files, which a page cached before this
      # release still loads.
      - name: Package the demo
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          args=()
          # Only a missing release skips the download; any other error fails,
          # so the next step cannot skip its newer-version check.
          if ! assets=$(gh release view web-demo --json assets -q '.assets[].name' 2> "$RUNNER_TEMP/error"); then
            cat "$RUNNER_TEMP/error" >&2
            grep -qx 'release not found' "$RUNNER_TEMP/error" || exit 1
            assets=""
          fi
          if grep -qx reshiki-web-demo.tar.gz <<< "$assets"; then
            gh release download web-demo -p reshiki-web-demo.tar.gz -D "$RUNNER_TEMP/published"
            args=(--previous "$RUNNER_TEMP/published/reshiki-web-demo.tar.gz")
          fi
          scripts/package_web_demo.sh "${args[@]}"
      - name: Replace the web-demo asset and redeploy the site
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(tar -xzOf dist/reshiki-web-demo.tar.gz demo/VERSION)
          notes="The browser editor at https://reshiki.com/demo/, built from v$version."
          if gh release view web-demo > /dev/null; then
            # Leave a demo from a newer release in place (semver order).
            if [[ -f $RUNNER_TEMP/published/reshiki-web-demo.tar.gz ]]; then
              published=$(tar -xzOf "$RUNNER_TEMP/published/reshiki-web-demo.tar.gz" demo/VERSION 2> /dev/null || true)
              if [[ -n $published ]]; then
                newest=$(uv run --no-project --python 3.12.15 python - "$published" "$version" << 'PY'
          import sys

          def key(version):
              core, _, pre = version.split("+")[0].partition("-")
              ids = [(0, int(i), "") if i.isdigit() else (1, 0, i) for i in pre.split(".")] if pre else []
              return [int(n) for n in core.split(".")], not pre, ids

          print(max(sys.argv[1:], key=key))
          PY
                )
                if [[ $newest != "$version" ]]; then
                  echo "::notice::The web-demo release has $published, newer than $version; leaving it."
                  exit 0
                fi
              fi
            fi
            gh release edit web-demo --notes "$notes"
          else
            gh release create web-demo --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Browser editor demo" --notes "$notes"
          fi
          gh release upload web-demo dist/reshiki-web-demo.tar.gz --clobber
          gh workflow run docs.yml --ref main
  # @ameyanagi/reshiki (packages/editor) follows each release on npm with the
  # app's version. A manual run with npm_only publishes main's version, for a
  # first publish without a new tag. docs/releasing.md describes the npm setup;
  # without a working credential this job leaves a notice and succeeds.
  npm:
    needs: [publish, web_demo]
    # A tag needs the demo job's build, not its demo upload. !cancelled() and
    # not always(), so cancelling the run stops the job before it publishes.
    if: >-
      ${{ !cancelled()
          && ((github.event_name == 'push' && needs.publish.result == 'success')
              || (github.event_name == 'workflow_dispatch' && inputs.npm_only)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: npm
    concurrency:
      group: npm
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - *actions_runtime
      - name: Choose the npm credential
        id: auth
        env:
          TRUSTED_PUBLISHING: ${{ vars.NPM_TRUSTED_PUBLISHING == 'true' }}
          HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          if [[ $GITHUB_EVENT_NAME == workflow_dispatch && $GITHUB_REF != refs/heads/main ]]; then
            echo "npm_only publishes main's version; run it on main" >&2
            exit 1
          fi
          if [[ $TRUSTED_PUBLISHING == true ]]; then
            mode=oidc
          elif [[ $HAS_TOKEN == true ]]; then
            mode=token
          else
            mode=none
            echo "::notice::No npm credential is configured (see docs/releasing.md), so @ameyanagi/reshiki was not published."
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.auth.outputs.mode != 'none'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.auth.outputs.mode != 'none'
        with:
          bun-version-file: package.json
      # Trusted publishing needs npm 11.5.1 or later, which Node 24 ships.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.auth.outputs.mode != 'none'
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - name: Check the npm token
        if: steps.auth.outputs.mode == 'token'
        id: token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          printf '//registry.npmjs.org/:_authToken=${NPM_TOKEN}\n' > "$RUNNER_TEMP/.npmrc"
          if user=$(NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/.npmrc npm whoami 2> "$RUNNER_TEMP/whoami.log"); then
            echo "NPM_TOKEN belongs to $user"
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/whoami.log"
            echo "::notice::npm rejected NPM_TOKEN (expired or invalid; see docs/releasing.md), so @ameyanagi/reshiki was not published."
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi
      # A tag publishes the build web_demo tested; npm_only builds it here.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.auth.outputs.mode != 'none' && steps.token.outputs.valid != 'false' && github.event_name == 'push'
        with:
          name: npm-package-dist
          path: packages/editor/dist
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        if: steps.auth.outputs.mode != 'none' && steps.token.outputs.valid != 'false' && github.event_name != 'push'
        with:
          version: "0.13.5"
          python-version: "3.12.15"
          enable-cache: false
      - name: Build the package
        if: steps.auth.outputs.mode != 'none' && steps.token.outputs.valid != 'false' && github.event_name != 'push'
        run: |
          rustup toolchain install 1.99.0 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.99.0
          scripts/build_wasm.sh
      - name: Test the package
        if: steps.auth.outputs.mode != 'none' && steps.token.outputs.valid != 'false'
        working-directory: packages/editor
        run: bun test
      - name: Publish the app's version unless npm has it
        if: steps.auth.outputs.mode != 'none' && steps.token.outputs.valid != 'false'
        working-directory: packages/editor
        env:
          MODE: ${{ steps.auth.outputs.mode }}
          NPM_TOKEN: ${{ steps.auth.outputs.mode == 'token' && secrets.NPM_TOKEN || '' }}
        run: |
          set -euo pipefail
          # validate has checked that a tag matches this version.
          version=$(awk -F '"' '/^version = / { print $2; exit }' ../../Cargo.toml)
          bun pm pkg set version="$version"
          name=$(bun pm pkg get name | tr -d '"')
          echo "npm $(npm --version), publishing $name@$version with $MODE"
          if [[ $(npm view "$name@$version" version 2> /dev/null || true) == "$version" ]]; then
            echo "::notice::$name@$version is already on npm."
            exit 0
          fi
          if [[ $MODE == token ]]; then
            export NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/.npmrc
          fi
          # latest stays on the newest stable release: prereleases go under next,
          # and an older stable release under release-<major.minor>.
          tag=latest
          if [[ $version == *-* ]]; then
            tag=next
          else
            latest=$(npm view "$name" dist-tags.latest 2> /dev/null || true)
            if [[ -n $latest && $(printf '%s\n' "$latest" "$version" | sort -V | tail -n 1) != "$version" ]]; then
              tag=release-${version%.*}
            fi
          fi
          status=0
          npm publish --provenance --access public --tag "$tag" --ignore-scripts 2>&1 | tee "$RUNNER_TEMP/publish.log" || status=$?
          if (( status != 0 )); then
            # Refused credentials skip npm; any other failure fails the job.
            if grep -qE 'E401|E403|E404|ENEEDAUTH|EOTP' "$RUNNER_TEMP/publish.log"; then
              echo "::notice::npm refused the $MODE credential (see docs/releasing.md), so $name@$version was not published."
              exit 0
            fi
            exit "$status"
          fi
