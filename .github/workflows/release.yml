name: Six native validation packages (unpublished; Windows functional evidence)
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full frozen production SHA directly below this validation overlay
        type: string
        required: true
      functional_only:
        description: Required functional-only lane; does not qualify antivirus protection
        type: boolean
        default: true
      nightly:
        description: Must remain false; validation preserves production version bytes
        type: boolean
        default: false
      sign_macos:
        description: Must remain false; validation packages remain unsigned
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: native-functional-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false
env:
  RESHIKI_PRODUCTION_CANDIDATE: ${{ inputs.candidate_sha }}
jobs:
  reference:
    needs: validate
    if: false
    uses: ./.github/workflows/checks.yml
    with:
      live_reference: true
  validate:
    runs-on: ubuntu-22.04
    outputs:
      nightly_version: ${{ steps.nightly.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.3"
          python-version: "3.12"
          enable-cache: false
      - name: Require unchanged version and unsigned functional-only validation
        if: inputs.nightly || inputs.sign_macos || !inputs.functional_only
        run: exit 1
      - name: Prepare nightly version
        if: inputs.nightly
        id: nightly
        run: |
          uv run --no-project --python 3.12 python -m unittest tests.test_prepare_nightly
          version=$(uv run --no-project --python 3.12 python scripts/prepare_nightly.py --identifier "$(date -u +%Y%m%d).${{ github.run_id }}.${{ github.run_attempt }}")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Require stable release tags to belong to main
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags --unshallow origin main
          git merge-base --is-ancestor HEAD FETCH_HEAD
      - name: Require tag and package versions to match
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --no-project --python 3.12 python scripts/build_release.py --tag "$RELEASE_TAG" --check-tag-only
  build:
    needs: validate
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: macos-arm64
            target: aarch64-apple-darwin
            python: "3.12"
          - os: macos-15-intel
            artifact: macos-x64
            target: x86_64-apple-darwin
            python: "3.12"
            # The pinned RDKit reference has no Intel macOS wheel. Runtime is native.
            native_only: true
          - os: windows-2022
            artifact: windows-x64
            target: x86_64-pc-windows-msvc
            msvc_arch: x64
            python: cpython-3.12-windows-x86_64-none
          - os: windows-11-arm
            artifact: windows-arm64
            target: aarch64-pc-windows-msvc
            msvc_arch: arm64
            # RDKit reference tests use the x64 wheel through Windows 11 emulation.
            python: cpython-3.12-windows-x86_64-none
          - os: ubuntu-22.04
            artifact: linux-x64
            target: x86_64-unknown-linux-gnu
            python: "3.12"
          - os: ubuntu-24.04-arm
            artifact: linux-arm64
            target: aarch64-unknown-linux-gnu
            python: "3.12"
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.3"
          python-version: ${{ matrix.python }}
      - name: Record exact production-source equivalence and workflow identity
        run: >-
          uv run --no-project --isolated --python 3.12 python -c "import os, sys; from pathlib import Path; sys.path.insert(0, 'scripts'); import collect_windows_functional as f; Path('evidence').mkdir(exist_ok=True); f.security.write_json(Path('evidence/source-equivalence.json'), {'source_equivalence': f.source_equivalence(os.environ['RESHIKI_PRODUCTION_CANDIDATE'], os.environ['GITHUB_SHA']), 'workflow_run': f.workflow_run(), 'antivirus_qualification': f.NO_AV})"
      - name: Verify native disposable Windows context before product execution
        if: runner.os == 'Windows'
        run: uv run --no-project --isolated --python 3.12 python scripts/collect_windows_functional.py preflight --architecture ${{ matrix.msvc_arch }} --source-commit ${{ github.sha }} --candidate "$env:RESHIKI_PRODUCTION_CANDIDATE" --output evidence/functional-preflight
      - name: Stamp nightly package version
        if: inputs.nightly
        shell: bash
        env:
          NIGHTLY_VERSION: ${{ needs.validate.outputs.nightly_version }}
        run: uv run --no-project --python 3.12 python scripts/prepare_nightly.py --version "$NIGHTLY_VERSION"
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          # Previous release caches included packaged license sources in target/.
          prefix-key: v1-release-staging
          cache-on-failure: true
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libfontconfig1-dev libudev-dev
      - run: rustup toolchain install 1.99.0 --profile minimal --target ${{ matrix.target }}
      - run: rustup default 1.99.0
      - name: Select the native Windows compiler
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc
        with:
          arch: ${{ matrix.msvc_arch }}
      - run: uv sync --locked
        if: matrix.native_only != true
      - name: Install pinned Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compilerInstaller = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $compilerInstaller
          if ((Get-FileHash $compilerInstaller -Algorithm SHA256).Hash.ToLowerInvariant() -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') { throw 'Inno Setup checksum mismatch' }
          $compilerDir = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          $installerProcess = Start-Process $compilerInstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$compilerDir`"") -Wait -PassThru
          if ($installerProcess.ExitCode -ne 0) { throw 'Inno Setup installation failed' }
          "RESHIKI_ISCC=$compilerDir\ISCC.exe" >> $env:GITHUB_ENV
      - name: Test chemistry and packaging on this platform
        if: matrix.native_only != true
        run: uv run --locked python -m unittest discover -s tests -p 'test_*.py'
      - name: Build Intel native helper boundary fixtures
        if: matrix.native_only == true
        run: uv run --no-project --isolated --python 3.12 python scripts/build_inchi_helper.py --target ${{ matrix.target }}
      - name: Test Intel Mac packaging without reference dependencies
        if: matrix.native_only == true
        env:
          RESHIKI_REQUIRE_INCHI_HELPER: "1"
        run: uv run --no-project --isolated --python 3.12 python -m unittest tests.test_release tests.test_release_downloads tests.test_prepare_nightly tests.test_inchi_distribution tests.test_inchi_helper_builder tests.test_inchi_helper_protocol tests.test_native_packaging tests.test_license_notices tests.test_native_clipboard tests.test_native_print
      - name: Verify reference dependencies
        if: matrix.native_only != true
        run: uv run --locked python scripts/check_reference_dependencies.py
      - name: Build and test extracted portable archive
        if: runner.os != 'Windows'
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: uv run --no-project --isolated --python 3.12 python scripts/build_release.py --target ${{ matrix.target }} --installer
      - name: Build Windows once and retain original native assertions and uninstallers
        if: runner.os == 'Windows'
        run: uv run --no-project --isolated --python 3.12 python scripts/collect_windows_functional.py build --architecture ${{ matrix.msvc_arch }} --source-commit ${{ github.sha }} --candidate "$env:RESHIKI_PRODUCTION_CANDIDATE" --target ${{ matrix.target }} --preflight evidence/functional-preflight/preflight.json --output evidence/functional
      - name: Check the application worker protocol and heap boundaries
        if: runner.os != 'Windows'
        env:
          RESHIKI_REQUIRE_INCHI_HELPER: "1"
          RESHIKI_TEST_PACKAGED_APP: ${{ github.workspace }}/target/${{ matrix.target }}/release/reshiki${{ runner.os == 'Windows' && '.exe' || '' }}
        run: uv run --no-project --isolated --python 3.12 python -m unittest tests.test_inchi_helper_protocol tests.test_inchi_distribution.HelperTests.test_packaged_application_worker_executes_when_supplied_for_validation
      - name: Test native macOS clipboard and physical print coordinates
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: cargo test --release --locked -p reshiki-macos --target ${{ matrix.target }}
      - name: Test native chemistry on Intel macOS
        if: matrix.artifact == 'macos-x64'
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
          RESHIKI_REQUIRE_INCHI_HELPER: "1"
          RESHIKI_INCHI_HELPER: ${{ github.workspace }}/target/x86_64-apple-darwin/release/reshiki
        run: cargo test --release --locked --no-default-features --lib --target x86_64-apple-darwin
      - name: Test the nightly application and renderer regressions
        if: inputs.nightly
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
          RESHIKI_REQUIRE_INCHI_HELPER: "1"
          RESHIKI_INCHI_HELPER: ${{ github.workspace }}/target/${{ matrix.target }}/release/reshiki${{ runner.os == 'Windows' && '.exe' || '' }}
        run: cargo test --release --locked --no-default-features --bin reshiki --target ${{ matrix.target }}
      - name: Preserve Windows raw protection context without an antivirus verdict
        if: always() && runner.os == 'Windows'
        run: uv run --no-project --isolated --python 3.12 python scripts/collect_windows_functional.py final-capture --architecture ${{ matrix.msvc_arch }} --source-commit ${{ github.sha }} --candidate "$env:RESHIKI_PRODUCTION_CANDIDATE" --preflight evidence/functional-preflight/preflight.json --output evidence/functional-final-context.json
      - name: Preserve source identity and Windows functional evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: functional-evidence-${{ matrix.artifact }}-${{ github.sha }}
          path: |
            evidence/**
            build/release-bundles/*/build.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: unsigned-${{ matrix.artifact }}
          path: dist/releases/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
  sign:
    needs: [validate, build]
    if: false
    environment: macos-signing
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: macos-arm64
          - os: macos-15-intel
            artifact: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.3"
          python-version: "3.12"
      - name: Match the nightly version of the qualified archive
        if: inputs.nightly
        env:
          NIGHTLY_VERSION: ${{ needs.validate.outputs.nightly_version }}
        run: uv run --no-project --python 3.12 python scripts/prepare_nightly.py --version "$NIGHTLY_VERSION"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-${{ matrix.artifact }}
          path: unsigned
      - name: Sign, notarize, staple, and verify the existing build
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
        run: uv run --no-project --isolated --python 3.12 python scripts/sign_release.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-${{ matrix.artifact }}
          path: dist/releases/*
          if-no-files-found: error
  publish:
    needs: [build, sign, reference]
    if: false
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.3"
          python-version: "3.12"
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: signed-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-windows-x64
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-linux-x64
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-windows-arm64
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-linux-arm64
          path: release
      - name: Check every archive and publish
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          uv run --no-project --python 3.12 python ../scripts/release_downloads.py --directory . --repository "$GH_REPO" --tag "$RELEASE_TAG" --notes notes.md
          args=(--latest)
          if [[ "$RELEASE_TAG" == *-* ]]; then args=(--prerelease --latest=false); fi
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes --notes-file notes.md "${args[@]}" *.zip *.tar.gz *.dmg *-setup.exe SHA256SUMS
