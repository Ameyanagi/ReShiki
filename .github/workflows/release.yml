name: Release builds
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      sign_macos:
        description: Sign and notarize macOS test packages (requires signing secrets)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'tag' }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.3"
          python-version: "3.12"
          enable-cache: false
      - name: Require tag and package versions to match
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --no-project --python 3.12 python scripts/build_release.py --tag "$RELEASE_TAG" --check-tag-only
  build:
    needs: validate
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: macos-arm64
            target: aarch64-apple-darwin
            python: "3.12"
          - os: windows-2022
            artifact: windows-x64
            target: x86_64-pc-windows-msvc
            msvc_arch: x64
            python: cpython-3.12-windows-x86_64-none
          - os: windows-11-arm
            artifact: windows-arm64
            target: aarch64-pc-windows-msvc
            msvc_arch: arm64
            # RDKit has no Windows ARM wheel. Windows 11 runs the x64 worker.
            python: cpython-3.12-windows-x86_64-none
          - os: ubuntu-22.04
            artifact: linux-x64
            target: x86_64-unknown-linux-gnu
            python: "3.12"
          - os: ubuntu-24.04-arm
            artifact: linux-arm64
            target: aarch64-unknown-linux-gnu
            python: "3.12"
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.3"
          python-version: ${{ matrix.python }}
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          cache-on-failure: true
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libfontconfig1-dev libudev-dev
      - run: rustup toolchain install 1.95.0 --profile minimal --target ${{ matrix.target }}
      - run: rustup default 1.95.0
      - name: Select the native Windows compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: ${{ matrix.msvc_arch }}
      - run: uv sync --locked
      - name: Install pinned Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compilerInstaller = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $compilerInstaller
          if ((Get-FileHash $compilerInstaller -Algorithm SHA256).Hash.ToLowerInvariant() -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') { throw 'Inno Setup checksum mismatch' }
          $compilerDir = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          $installerProcess = Start-Process $compilerInstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$compilerDir`"") -Wait -PassThru
          if ($installerProcess.ExitCode -ne 0) { throw 'Inno Setup installation failed' }
          "RESHIKI_ISCC=$compilerDir\ISCC.exe" >> $env:GITHUB_ENV
      - name: Test chemistry and packaging on this platform
        run: uv run --locked python -m unittest discover -s tests -p 'test_*.py'
      - name: Verify production dependencies
        run: uv run --locked python scripts/check_runtime_dependencies.py
      - name: Build and test extracted portable archive
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: uv run --locked python scripts/build_release.py --target ${{ matrix.target }} --fetch-inchi-source --installer
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-${{ matrix.artifact }}
          path: dist/releases/*
          if-no-files-found: error
  sign:
    needs: build
    if: github.event_name == 'push' || inputs.sign_macos
    environment: macos-signing
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.3"
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-${{ matrix.artifact }}
          path: unsigned
      - name: Sign, notarize, staple, and verify the existing build
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
        run: uv run --locked python scripts/sign_release.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-${{ matrix.artifact }}
          path: dist/releases/*
          if-no-files-found: error
  publish:
    needs: [build, sign]
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: signed-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-windows-x64
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-linux-x64
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-windows-arm64
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-linux-arm64
          path: release
      - name: Check every archive and publish
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat *.sha256 | tr -d '\r' > SHA256SUMS
          sha256sum --check SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 8
          args=()
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes "${args[@]}" *.zip *.tar.gz *.dmg *-setup.exe SHA256SUMS
