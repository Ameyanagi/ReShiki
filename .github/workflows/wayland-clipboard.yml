name: Wayland clipboard
on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "crates/**"
      - "native/linux/**"
      - "vendor/smithay-clipboard/**"
      - "vendor/iced/**"
      - "tests/fixtures/ui-ethanol.reshiki"
      - "scripts/wayland_clipboard_qa.sh"
      - ".github/workflows/wayland-clipboard.yml"
      - ".github/ci-images/**"
      - ".github/workflows/ci-images.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "crates/**"
      - "native/linux/**"
      - "vendor/smithay-clipboard/**"
      - "vendor/iced/**"
      - "tests/fixtures/ui-ethanol.reshiki"
      - "scripts/wayland_clipboard_qa.sh"
      - ".github/workflows/wayland-clipboard.yml"
      - ".github/ci-images/**"
      - ".github/workflows/ci-images.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wayland-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  UV_PYTHON_PREFERENCE: only-managed
jobs:
  images:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci-images.yml
  clipboard:
    name: Real ${{ matrix.compositor }} Wayland clipboard
    needs: images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container: ${{ needs.images.outputs.noble_desktop }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        compositor: [gnome, sway]
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - &actions_runtime
        name: Patch the Actions Node runtime when needed
        id: actions_runtime_guard
        shell: pwsh
        run: |
          # Embedded before checkout; setup-node does not change JavaScript actions' Node.
          $ErrorActionPreference = 'Stop'
          $workers = @(Get-Process -Name Runner.Worker -ErrorAction SilentlyContinue)
          $containerJob = $workers.Count -eq 0 -and -not $IsWindows -and (Test-Path -LiteralPath '/__e/node24/bin/node' -PathType Leaf)
          if ($containerJob) {
              $node = '/__e/node24/bin/node'
          } else {
              if ($workers.Count -ne 1) { throw 'Expected exactly one live Runner.Worker.' }
              $root = Split-Path (Split-Path $workers[0].Path -Parent) -Parent
              $name = if ($IsWindows) { 'node.exe' } else { 'node' }
              $node = Join-Path $root "externals/node24/bin/$name"
          }
          $version = & $node --version
          if ($LASTEXITCODE -ne 0 -or $version -cnotmatch '^v24\.[0-9]+\.[0-9]+$') {
              throw 'Could not read the active runner Node 24 version.'
          }
          Write-Host "Actions runtime before bootstrap: $version ($node)"
          if ([version] $version.Substring(1) -lt [version] '24.22.1') {
              if ($containerJob) {
                  throw 'The read-only /__e runner Node of a container job cannot be patched; run this job without a container.'
              }
              # Official signed SHASUMS256.txt provenance is in actions_node_bootstrap.json.
              $assets = @{
                  'macOS-ARM64' = @('node-v24.22.1-darwin-arm64.tar.gz', '89c682593d76cd44233fa53b1563264e7de9cbb189cad169135c5b4fadfbc0a7')
                  'macOS-X64' = @('node-v24.22.1-darwin-x64.tar.gz', 'd132557e7ee2b85af08b0c8c34338e65c6430f2238d01f727728ef42dc83b035')
                  'Linux-ARM64' = @('node-v24.22.1-linux-arm64.tar.gz', '33c37be234ba8bee041961047b19160f4d7d0f164e8e246f78bdd10feff148b3')
                  'Linux-X64' = @('node-v24.22.1-linux-x64.tar.gz', 'eb6728e77c576a35162c122c45ccadf224d89ff00abc8dae46cc2897c6002d7c')
                  'Windows-ARM64' = @('win-arm64/node.exe', '8bea91dc437fe01e7d92ef0efc6c9eaf654369aaba9b2d3e9841552ea7b95a00')
                  'Windows-X64' = @('win-x64/node.exe', 'd702daa815eabbff763c7d3808e235cf031cf2ca70211b56847bc72f51e240e5')
              }
              $asset = $assets["$env:RUNNER_OS-$env:RUNNER_ARCH"]
              if ($null -eq $asset) { throw 'Unsupported runner OS/architecture.' }
              $temporary = Join-Path $env:RUNNER_TEMP ('reshiki-node-' + [Guid]::NewGuid())
              New-Item -ItemType Directory -Path $temporary | Out-Null
              try {
                  $download = Join-Path $temporary 'node-download'
                  Invoke-WebRequest -Uri "https://nodejs.org/dist/v24.22.1/$($asset[0])" -OutFile $download
                  if ((Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash -ine $asset[1]) {
                      throw 'Official Node artifact SHA256 mismatch.'
                  }
                  if ($IsWindows) {
                      $candidate = $download # The pinned Windows asset is the raw node.exe.
                  } else {
                      & tar -xzf $download -C $temporary
                      if ($LASTEXITCODE -ne 0) { throw 'Official Node archive extraction failed.' }
                      $candidate = Join-Path $temporary ($asset[0].Replace('.tar.gz', '') + '/bin/node')
                  }
                  Copy-Item -LiteralPath $candidate -Destination $node -Force
              } finally {
                  Remove-Item -LiteralPath $temporary -Recurse -Force
              }
              $version = & $node --version
              if ($LASTEXITCODE -ne 0 -or $version -cne 'v24.22.1') {
                  throw 'The installed Actions Node did not report v24.22.1.'
              }
          }
          Write-Host "Verified Actions runtime: $version ($node)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.99.1 --profile minimal && rustup default 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: wayland-qa
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.12.15"
      - name: Check the compositor harness
        run: |
          uv run --locked ruff check native/linux/tests/gtk_receiver.py native/linux/tests/wayland_session.py
          uv run --locked ruff format --check native/linux/tests/gtk_receiver.py native/linux/tests/wayland_session.py
          bash -n scripts/wayland_clipboard_qa.sh
          cargo tree --locked --no-default-features -e features | /usr/bin/python3 -c 'import sys; assert "wayland-qa" not in sys.stdin.read()'
      - name: Build the GUI with default-off compositor observation and delay hooks
        run: cargo build --locked --no-default-features --features wayland-qa --bin reshiki
      - name: Start a system D-Bus without logind
        # GNOME Shell needs a system bus; without logind its seat directory selects the non-systemd login manager.
        run: rm -rf /run/systemd/seats && dbus-daemon --system --fork
      - name: Exercise real input, clipboard transfer, cancellation and owner exit
        run: bash scripts/wayland_clipboard_qa.sh ${{ matrix.compositor }} target/debug/reshiki artifacts/wayland-qa/${{ matrix.compositor }}
      - name: Retain protocol traces, MIME bytes, saved drawings and package provenance
        if: ${{ always() && steps.actions_runtime_guard.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wayland-${{ matrix.compositor }}
          path: artifacts/wayland-qa/${{ matrix.compositor }}/
          if-no-files-found: error
