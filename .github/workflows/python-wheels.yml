name: Python wheels
# Builds and tests the abi3 wheels that release.yml publishes to PyPI. Pull
# requests that touch the package run it as a dry run without publishing.
on:
  pull_request:
    paths:
      - "crates/python/**"
      - "LICENSE*"
      - "NOTICE"
      - "licenses/**"
      - "scripts/license_notices.py"
      - "scripts/check_python_wheel_notices.py"
      - "scripts/ci_scope.py"
      - ".github/workflows/python-wheels.yml"
  workflow_call:
permissions:
  contents: read
concurrency:
  # run_id prevents workflow_call from release.yml from queuing or cancelling runs.
  group: python-wheels-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  UV_PYTHON_PREFERENCE: only-managed
jobs:
  # macOS wheels build only on stacked merge/* PRs, full-ci-labelled PRs and
  # releases; scripts/ci_scope.py leaves their rows out otherwise.
  scope:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - &actions_runtime
        name: Patch the Actions Node runtime when needed
        id: actions_runtime_guard
        shell: pwsh
        run: |
          # Embedded before checkout; setup-node does not change JavaScript actions' Node.
          $ErrorActionPreference = 'Stop'
          $workers = @(Get-Process -Name Runner.Worker -ErrorAction SilentlyContinue)
          $containerJob = $workers.Count -eq 0 -and -not $IsWindows -and (Test-Path -LiteralPath '/__e/node24/bin/node' -PathType Leaf)
          if ($containerJob) {
              $node = '/__e/node24/bin/node'
          } else {
              if ($workers.Count -ne 1) { throw 'Expected exactly one live Runner.Worker.' }
              $root = Split-Path (Split-Path $workers[0].Path -Parent) -Parent
              $name = if ($IsWindows) { 'node.exe' } else { 'node' }
              $node = Join-Path $root "externals/node24/bin/$name"
          }
          $version = & $node --version
          if ($LASTEXITCODE -ne 0 -or $version -cnotmatch '^v24\.[0-9]+\.[0-9]+$') {
              throw 'Could not read the active runner Node 24 version.'
          }
          Write-Host "Actions runtime before bootstrap: $version ($node)"
          if ([version] $version.Substring(1) -lt [version] '24.22.1') {
              if ($containerJob) {
                  throw 'The read-only /__e runner Node of a container job cannot be patched; run this job without a container.'
              }
              # Official signed SHASUMS256.txt provenance is in actions_node_bootstrap.json.
              $assets = @{
                  'macOS-ARM64' = @('node-v24.22.1-darwin-arm64.tar.gz', '89c682593d76cd44233fa53b1563264e7de9cbb189cad169135c5b4fadfbc0a7')
                  'macOS-X64' = @('node-v24.22.1-darwin-x64.tar.gz', 'd132557e7ee2b85af08b0c8c34338e65c6430f2238d01f727728ef42dc83b035')
                  'Linux-ARM64' = @('node-v24.22.1-linux-arm64.tar.gz', '33c37be234ba8bee041961047b19160f4d7d0f164e8e246f78bdd10feff148b3')
                  'Linux-X64' = @('node-v24.22.1-linux-x64.tar.gz', 'eb6728e77c576a35162c122c45ccadf224d89ff00abc8dae46cc2897c6002d7c')
                  'Windows-ARM64' = @('win-arm64/node.exe', '8bea91dc437fe01e7d92ef0efc6c9eaf654369aaba9b2d3e9841552ea7b95a00')
                  'Windows-X64' = @('win-x64/node.exe', 'd702daa815eabbff763c7d3808e235cf031cf2ca70211b56847bc72f51e240e5')
              }
              $asset = $assets["$env:RUNNER_OS-$env:RUNNER_ARCH"]
              if ($null -eq $asset) { throw 'Unsupported runner OS/architecture.' }
              $temporary = Join-Path $env:RUNNER_TEMP ('reshiki-node-' + [Guid]::NewGuid())
              New-Item -ItemType Directory -Path $temporary | Out-Null
              try {
                  $download = Join-Path $temporary 'node-download'
                  Invoke-WebRequest -Uri "https://nodejs.org/dist/v24.22.1/$($asset[0])" -OutFile $download
                  if ((Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash -ine $asset[1]) {
                      throw 'Official Node artifact SHA256 mismatch.'
                  }
                  if ($IsWindows) {
                      $candidate = $download # The pinned Windows asset is the raw node.exe.
                  } else {
                      & tar -xzf $download -C $temporary
                      if ($LASTEXITCODE -ne 0) { throw 'Official Node archive extraction failed.' }
                      $candidate = Join-Path $temporary ($asset[0].Replace('.tar.gz', '') + '/bin/node')
                  }
                  Copy-Item -LiteralPath $candidate -Destination $node -Force
              } finally {
                  Remove-Item -LiteralPath $temporary -Recurse -Force
              }
              $version = & $node --version
              if ($LASTEXITCODE -ne 0 -or $version -cne 'v24.22.1') {
                  throw 'The installed Actions Node did not report v24.22.1.'
              }
          }
          Write-Host "Verified Actions runtime: $version ($node)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: scope
        run: python3 scripts/ci_scope.py
  # No sdist: the package compiles assets, presets and vendored crates from the
  # repository root, which maturin cannot include in a source distribution.
  # Free-threaded Python needs a separate non-abi3 build and is not covered.
  wheel:
    needs: scope
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.matrix).wheel }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      UV_PYTHON: ${{ matrix.python || '3.12.15' }}
    steps:
      - *actions_runtime
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: ${{ matrix.python || '3.12.15' }}
          enable-cache: false
      - run: rustup toolchain install 1.99.1 --profile minimal --target ${{ matrix.target }} && rustup default 1.99.1
      - name: Generate wheel license notices
        run: uv run --no-project --python 3.12.15 python scripts/license_notices.py --target ${{ matrix.target }}
      # Builds in the manylinux2014 container.
      - name: Build the manylinux wheel
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.15.0
          rust-toolchain: 1.99.1
          manylinux: auto
          target: ${{ matrix.target }}
          args: --release --locked --manifest-path crates/python/Cargo.toml --out dist
      - name: Select the native Windows compiler
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc
        with:
          arch: ${{ matrix.msvc_arch }}
      # The default shell on Windows: under bash, Git's link shadows the MSVC linker.
      - name: Build the wheel
        if: runner.os != 'Linux'
        run: uvx maturin@1.15.0 build --release --locked --manifest-path crates/python/Cargo.toml --target ${{ matrix.target }} --interpreter python --out dist
      - name: Check wheel license notices
        run: uv run --no-project --python 3.12.15 python scripts/check_python_wheel_notices.py "dist/*.whl"
      - name: Test the built wheel
        if: matrix.test
        shell: bash
        run: |
          uv sync --project crates/python --all-extras --no-install-project
          uv run --project crates/python --no-sync --with ./dist/*.whl --with rdkit pytest crates/python/tests
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-wheel-${{ matrix.artifact }}
          path: dist/*.whl
          if-no-files-found: error
