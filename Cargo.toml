[package]
name = "reshiki"
version = "0.5.0"
edition = "2024"
description = "A molecular drawing workspace"

[workspace]
members = ["native/windows", "crates/depict-math"]
default-members = ["."]

[target.'cfg(windows)'.dependencies]
reshiki-windows = { path = "native/windows" }
iced = { version = "0.14", default-features = false, features = ["tiny-skia"] }

[target.'cfg(not(windows))'.dependencies]
iced = { version = "0.14", default-features = false, features = ["wgpu"] }

[dependencies]
reshiki-depict-math = { path = "crates/depict-math" }
iced = { version = "0.14", default-features = false, features = [
  "canvas",
  "tokio",
  "advanced",
  "advanced-shaping",
  "image-without-codecs",
  "x11",
  "wayland",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
base64 = "0.22"
tokio = { version = "1", features = [
  "process",
  "io-util",
  "sync",
  "time",
  "rt-multi-thread",
  "macros",
] }
rfd = "0.15"
tempfile = "3"
directories-next = "2"
resvg = "0.45"
png = "0.17"
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "tiff",
  "webp",
  "gif",
  "bmp",
] }
pdf-writer = "0.12.1"
ttf-parser = "0.25"
svg2pdf = { version = "0.13", default-features = false, features = ["text", "image"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
semver = "1"
open = "5"
roxmltree = "0.20"
tiff = "0.11.3"
thiserror = "2"
sha2 = { version = "0.10.9", default-features = false, features = ["force-soft"] }

[profile.dev]
debug = 1

# RDKit's macOS ABI uses paired sincos. Compile only this non-inlined wrapper
# with optimization so debug builds select the same libm call as release.
# tests/depict_numeric.md records the native evidence and strict comparisons.
[profile.dev.package.reshiki-depict-math]
opt-level = 1

[profile.test.package.reshiki-depict-math]
opt-level = 1

[dev-dependencies]
anyhow = "1"
# Exercise both CPU dispatch paths of the patched JPEG dependency.
zune-jpeg = "0.5.15"
zune-core = "0.5.3"

[build-dependencies]
anyhow = "1"

[patch.crates-io]
# Preserve libjpeg's small-component and edge chroma sampling semantics.
zune-jpeg = { path = "vendor/zune-jpeg" }
