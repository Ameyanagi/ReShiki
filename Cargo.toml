[package]
name = "reshiki"
version = "0.4.0"
edition = "2024"
description = "A molecular drawing workspace"

[workspace]
members = ["native/windows"]
default-members = ["."]

[target.'cfg(windows)'.dependencies]
reshiki-windows = { path = "native/windows" }
iced = { version = "0.14", default-features = false, features = ["tiny-skia"] }

[target.'cfg(not(windows))'.dependencies]
iced = { version = "0.14", default-features = false, features = ["wgpu"] }

[dependencies]
iced = { version = "0.14", default-features = false, features = [
  "canvas",
  "tokio",
  "advanced",
  "advanced-shaping",
  "image-without-codecs",
  "x11",
  "wayland",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
base64 = "0.22"
tokio = { version = "1", features = [
  "process",
  "io-util",
  "sync",
  "time",
  "rt-multi-thread",
  "macros",
] }
rfd = "0.15"
tempfile = "3"
directories-next = "2"
resvg = "0.45"
png = "0.17"
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "tiff",
  "webp",
  "gif",
  "bmp",
] }
pdf-writer = "0.12.1"
ttf-parser = "0.25"
svg2pdf = { version = "0.13", default-features = false, features = ["text", "image"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
semver = "1"
open = "5"
roxmltree = "0.20"
tiff = "0.11.3"

[profile.dev]
debug = 1
