[package]
name = "reshiki"
version = "0.4.0"
edition = "2024"
description = "A molecular drawing workspace"

[dependencies]
iced = { version = "0.14", default-features = false, features = [
  "wgpu",
  "canvas",
  "tokio",
  "advanced",
  "advanced-shaping",
  "image-without-codecs",
  "x11",
  "wayland",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = [
  "process",
  "io-util",
  "sync",
  "time",
  "rt-multi-thread",
  "macros",
] }
rfd = "0.15"
tempfile = "3"
directories-next = "2"
resvg = "0.45"
png = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "webp"] }
pdf-writer = "0.12.1"
ttf-parser = "0.25"
svg2pdf = { version = "0.13", default-features = false, features = ["text", "image"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
semver = "1"
open = "5"

[profile.dev]
debug = 1
