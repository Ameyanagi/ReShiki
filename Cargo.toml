[package]
name = "reshiki"
version = "0.11.0"
edition = "2024"
default-run = "reshiki"
description = "A molecular drawing workspace"
# Original ReShiki code; see LICENSE for third-party exclusions and notices.
license = "MIT OR Apache-2.0"

[features]
default = []
# Optional Python/RDKit development oracles, never part of release builds.
rdkit-reference = [
  "reshiki-chemistry/rdkit-reference",
  "reshiki-model/rdkit-reference",
  "reshiki-io/rdkit-reference",
  "reshiki-agent/rdkit-reference",
]
# Opt-in state observation for disposable compositor integration tests.
wayland-qa = ["reshiki-linux/wayland-qa"]

[workspace]
members = [
  "native/macos",
  "native/windows",
  "native/linux",
  "native/geometry",
  "native/process",
  "crates/agent",
  "crates/chemistry",
  "crates/depict-math",
  "crates/io",
  "crates/mcp",
  "crates/model",
  "crates/opsin",
  "crates/process-heap",
]
default-members = [
  ".",
  "crates/agent",
  "crates/chemistry",
  "crates/io",
  "crates/mcp",
  "crates/model",
]

[target.'cfg(target_os = "macos")'.dependencies]
reshiki-macos = { path = "native/macos" }

[target.'cfg(target_os = "linux")'.dependencies]
reshiki-linux = { path = "native/linux" }

[target.'cfg(windows)'.dependencies]
reshiki-windows = { path = "native/windows" }
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia"] }

[target.'cfg(windows)'.dev-dependencies]
# The partial-redraw regression tests exercise the software fallback directly.
iced_tiny_skia = { version = "0.14", default-features = false }

[target.'cfg(not(windows))'.dependencies]
iced = { version = "0.14", default-features = false, features = ["wgpu"] }

[dependencies]
opsin = { path = "crates/opsin" }
reshiki-geometry = { path = "native/geometry" }
reshiki-process = { path = "native/process" }
accesskit = "=0.24.1"
reshiki-process-heap = { path = "crates/process-heap" }
cosmolkit-inchi = { version = "=0.3.0", git = "https://github.com/Ameyanagi/COSMolKit.git", rev = "252a1f3d6480fc4a0abcd51d76707f51f69b4406" }
reshiki-depict-math = { path = "crates/depict-math" }
reshiki-chemistry = { path = "crates/chemistry" }
reshiki-model = { path = "crates/model" }
reshiki-io = { path = "crates/io" }
reshiki-agent = { path = "crates/agent" }
reshiki-mcp = { path = "crates/mcp" }
iced = { version = "0.14", default-features = false, features = [
  "canvas",
  "tokio",
  "advanced",
  "advanced-shaping",
  "image-without-codecs",
  "x11",
  "wayland",
] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
base64 = "0.22"
tokio = { version = "1", features = [
  "process",
  "fs",
  "io-util",
  "sync",
  "time",
  "rt-multi-thread",
  "macros",
] }
rfd = "0.15"
tempfile = "3"
directories-next = "2"
resvg = "0.45"
png = "0.17"
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "tiff",
  "webp",
  "gif",
  "bmp",
] }
pdf-writer = "0.12.1"
ttf-parser = "0.25"
swash = "0.2.10"
svg2pdf = { version = "0.13", default-features = false, features = ["text", "image"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
semver = "1"
open = "5"
roxmltree = "0.20"
tiff = "0.11.3"
thiserror = "2"
sha2 = { version = "0.10.9", default-features = false, features = ["force-soft"] }

[profile.dev]
debug = 1

# RDKit's macOS ABI uses paired sincos. Compile only this non-inlined wrapper
# with optimization so debug builds select the same libm call as release.
# reference/depict_numeric.md records the native evidence and strict comparisons.
[profile.dev.package.reshiki-depict-math]
opt-level = 1

[profile.test.package.reshiki-depict-math]
opt-level = 1

# Numerical geometry tests exercise the application's fixed embedding deadline.
# Optimize the chemistry dependency while retaining test assertions and checks.
[profile.test.package.cosmolkit-core]
opt-level = 3

[dev-dependencies]
reshiki-process-heap = { path = "crates/process-heap", features = ["allocation-metrics"] }
accesskit_consumer = "=0.38.0"
anyhow = "1"
# Exercise the runtime's real overlay-before-base event routing.
iced_runtime = "0.14"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
# Exercise both CPU dispatch paths of the patched JPEG dependency.
zune-jpeg = "0.5.15"
zune-core = "0.5.3"
# Drive `reshiki --mcp` with the rmcp client over child-process pipes.
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-async-rw"] }

[build-dependencies]
anyhow = "1"

[patch.crates-io]
# Preserve libjpeg's small-component and edge chroma sampling semantics.
zune-jpeg = { path = "vendor/zune-jpeg" }
# Preserve requested variable-font weights through SVG and selectable PDF text.
usvg = { path = "vendor/usvg" }
svg2pdf = { path = "vendor/svg2pdf" }
# Share Iced's standard Wayland data device for bounded binary clipboard offers.
smithay-clipboard = { path = "vendor/smithay-clipboard" }

# Independent oracle suites live in reference/ and require the development reference.

