[package]
name = "moruno"
version = "0.1.0"
edition = "2024"
description = "A molecular drawing workspace"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["wgpu", "canvas", "tokio", "advanced-shaping", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt-multi-thread", "macros"] }
rfd = "0.15"
tempfile = "3"

[profile.dev]
debug = 1
