notes = "Native table decoder and longest-prefix interpreter for the project-specific OPSINDFA format; row, word, live_transitions, step, is_accept, run, load and Reader methods. This replaces runtime dk.brics deserialization. OPSIN supplies grammar/table semantics; no dk.brics library source is present in the pinned upstream tree or this scope, so this audit makes no clean-room claim for the interpreter. Original classification is a repository-history inference, not a clean-room certification. Current crate metadata licenses this file MIT; the plan proposes dual licensing original extraction code, which has not been applied here. Unresolved: Header names dk.brics automata but does not declare whether implementation is original or adapted. No identified copied dk.brics code; independent originality of standard DFA stepping cannot be proved from these repository records."

